<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vett Trade Verification Admin</title><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#0b1724}.top{height:70px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900}.brand span{color:#d4aa4c}.top a{color:#0b1724;text-decoration:none;font-weight:800}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e7eb;border-radius:15px;padding:22px;margin:14px 0}.muted{color:#6f7882}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff5de;font-size:11px;font-weight:900}.primary,.secondary,.danger{padding:10px 13px;border-radius:8px;font-weight:900;cursor:pointer}.primary{background:#0b1724;color:#fff;border:0}.secondary{background:#fff;border:1px solid #ddd}.danger{background:#fff0f0;color:#9a3838;border:1px solid #eccaca}.checks{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.hidden{display:none}input,textarea{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}.notice,.error{padding:11px;border-radius:8px;margin:12px 0}.notice{background:#edf8f3}.error{background:#fff0f0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand">VETT <span>TRADE</span> · VERIFICATION</div><a href="/admin.html">← Admin</a></div><div class="wrap"><div id="login" class="card"><h1>Verification admin</h1><form id="lf"><input id="em" type="email" placeholder="Email" required><br><br><input id="pw" type="password" placeholder="Password" required><br><button class="primary" style="margin-top:12px">SIGN IN</button></form><div id="lm"></div></div><div id="app" class="hidden"><h1>Plumber verification queue</h1><p class="muted">Review documents and external registers before approving. Upload alone never counts as verification.</p><div id="msg"></div><div id="list"></div></div></div><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),rows=[];async function api(p,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+p,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}async function boot(){if(!s?.access_token)return;try{if(!await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'}))throw new Error('Admin access required');login.classList.add('hidden');app.classList.remove('hidden');rows=await api('/rest/v1/rpc/get_admin_verification_queue',{method:'POST',body:'{}'});render()}catch(e){lm.innerHTML='<div class="error">'+e.message+'</div>'}}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function render(){list.innerHTML=rows.map((p,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2 style="margin:0">${esc(p.business_name)}</h2><div class="muted">${esc(p.contact_name)} · ${esc(p.email)} · ${esc(p.phone)}</div></div><span class="pill">${esc(p.verification_status)}</span></div><div class="grid" style="margin-top:16px"><div><b>Legal / business</b><p>${esc(p.legal_name)}<br>${esc(p.trading_type)}<br>Company: ${esc(p.company_number||'N/A')}<br>${esc(p.business_address)}</p></div><div><b>Trading</b><p>${esc(p.years_trading)} years<br>${p.website_url?'<a target="_blank" href="'+esc(p.website_url)+'">Website/profile</a>':'No website/profile'}</p></div><div><b>Insurance</b><p>${esc(p.insurance_provider)}<br>Policy: ${esc(p.insurance_policy_number)}<br>Cover: £${((p.insurance_cover_pence||0)/100).toLocaleString()}<br>Expires: ${esc(p.insurance_expiry)}</p></div></div><div><b>Gas work:</b> ${p.wants_gas_work?'Yes · Gas Safe '+esc(p.gas_safe_number):'No'}</div><div style="margin:14px 0"><button class="secondary" onclick="doc('${esc(p.identity_document_path)}')">View photo ID</button> <button class="secondary" onclick="doc('${esc(p.liability_document_path)}')">View liability certificate</button></div><div class="checks"><label><input id="id-${i}" type="checkbox" ${p.identity_verified?'checked':''}> Identity checked</label><label><input id="li-${i}" type="checkbox" ${p.public_liability_verified?'checked':''}> Liability checked</label>${p.wants_gas_work?`<label><input id="gas-${i}" type="checkbox" ${p.gas_safe_verified?'checked':''}> Gas Safe checked</label>`:''}</div><textarea id="notes-${i}" placeholder="Verification notes">${esc(p.verification_notes||'')}</textarea><div style="margin-top:12px"><button class="primary" onclick="review(${i},'verified')">Mark verified</button> <button class="danger" onclick="review(${i},'rejected')">Reject</button> <button class="secondary" onclick="review(${i},'pending')">Keep pending</button></div></div>`).join('')||'<div class="card">No applications.</div>'}async function doc(path){if(!path)return alert('No document uploaded');const r=await fetch(U+'/functions/v1/admin-verification-document',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({path})}),d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Unable to open document');window.open(d.url,'_blank')}async function review(i,status){const p=rows[i],idv=document.getElementById('id-'+i).checked,liv=document.getElementById('li-'+i).checked,gas=p.wants_gas_work?document.getElementById('gas-'+i).checked:false;if(status==='verified'&&(!idv||!liv||(p.wants_gas_work&&!gas)))return alert('Complete all required checks before verifying.');try{await api('/rest/v1/rpc/admin_review_plumber_verification',{method:'POST',body:JSON.stringify({p_plumber_id:p.id,p_identity_verified:idv,p_liability_verified:liv,p_gas_safe_verified:gas,p_status:status,p_notes:document.getElementById('notes-'+i).value})});msg.innerHTML='<div class="notice">Verification updated.</div>';rows=await api('/rest/v1/rpc/get_admin_verification_queue',{method:'POST',body:'{}'});render()}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}lf.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em.value.trim(),password:pw.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));boot()}catch(e){lm.innerHTML='<div class="error">'+e.message+'</div>'}};boot();</script></body></html>
