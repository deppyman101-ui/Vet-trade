<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VettTrade Admin · Evidence</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 4%}.brand{font-weight:950}.brand span{color:var(--gold)}.top a{color:inherit;text-decoration:none;font-weight:850}.wrap{max-width:980px;margin:auto;padding:34px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.login{max-width:480px;margin:50px auto}.muted{color:var(--muted);line-height:1.5}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.primary,.secondary{padding:11px 14px;border-radius:8px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff}.hidden{display:none!important}.event{border-left:4px solid #d5dce2;padding:12px 0 12px 14px;margin:12px 0}.event.arrived{border-color:#457aa3}.event.no_access{border-color:#d6a64b}.event.completion{border-color:var(--green)}.meta{font-size:12px;color:var(--muted)}.photos{display:flex;gap:8px;overflow:auto;margin-top:10px}.photos img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.error,.notice{padding:12px;border-radius:8px;margin-top:12px}.error{background:#fff0f0}.notice{background:#edf8f3}</style></head><body><header class="top"><div class="brand">VETT<span>TRADE</span> · EVIDENCE</div><a href="/admin.html">← Admin</a></header><main class="wrap"><section id="loginBox" class="card login"><h1>Admin login</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><br><br><input id="password" type="password" placeholder="Password" required><br><br><button class="primary" style="width:100%">SIGN IN</button></form><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="card"><div class="eyebrow">Job evidence</div><h1>Attendance & completion records</h1><p class="muted">Select a VettTrade job to review arrival evidence, No Access cards and completion photos.</p><select id="jobSelect" onchange="loadEvidence()"></select></div><div class="card"><div id="evidence" class="muted">Select a job.</div></div></section></main><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),jobs=[];async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString():'—'}async function boot(){if(!s?.access_token)return;try{if(!await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'}))throw new Error('Admin access required');loginBox.classList.add('hidden');app.classList.remove('hidden');jobs=await api('/rest/v1/rpc/get_admin_jobs_v2',{method:'POST',body:'{}'});jobSelect.innerHTML='<option value="">Choose a job</option>'+jobs.map(j=>'<option value="'+j.id+'">'+esc(j.reference)+' · '+esc(j.trade_category)+' · '+esc(j.customer_name)+'</option>').join('');const q=new URLSearchParams(location.search).get('id');if(q&&jobs.some(j=>j.id===q)){jobSelect.value=q;loadEvidence()}}catch(e){loginMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function loadEvidence(){const id=jobSelect.value;if(!id){evidence.innerHTML='Select a job.';return}evidence.innerHTML='Loading evidence…';try{const r=await fetch(U+'/functions/v1/job-evidence-links',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({leadId:id})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load evidence');const arr=d.events||[];evidence.innerHTML=arr.length?arr.map(e=>'<div class="event '+esc(e.event_type)+'"><b>'+esc(e.event_type==='no_access'?'NO ACCESS CARD':e.event_type==='completion'?'JOB COMPLETED':'ARRIVED ON SITE')+'</b><div class="meta">'+dt(e.created_at)+(e.trade_name?' · '+esc(e.trade_name):'')+'</div>'+(e.attempted_contact?'<div class="meta">✓ Contact attempt recorded</div>':'')+(e.note?'<p>'+esc(e.note)+'</p>':'')+(e.photos?.length?'<div class="photos">'+e.photos.map(p=>p.url?'<a href="'+esc(p.url)+'" target="_blank"><img src="'+esc(p.url)+'" alt="Evidence"></a>':'').join('')+'</div>':'')+'</div>').join(''):'<div class="notice">No site evidence has been recorded for this job yet.</div>'}catch(e){evidence.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));boot()}catch(e){loginMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}};boot();</script></body></html>
