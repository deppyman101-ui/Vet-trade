<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VettTrade Admin Users</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-weight:950}.brand span{color:var(--gold)}.top a{color:inherit;text-decoration:none;font-weight:850}.wrap{max-width:900px;margin:auto;padding:34px 20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.auth{max-width:500px;margin:50px auto}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.muted{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input{width:100%;padding:11px;border:1px solid #d6dde3;border-radius:8px;font:inherit}.primary,.secondary,.danger{padding:11px 14px;border-radius:8px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.primary:disabled{opacity:.6;cursor:not-allowed}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.danger{border:1px solid #eccaca;background:#fff0f0;color:var(--red)}.hidden{display:none!important}.invite{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.admin{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;gap:18px;align-items:center}.admin:first-child{border-top:0}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2f5}.owner{background:#fff5de;color:#87671f}.ok{background:#e8f6ef;color:var(--green)}.notice,.error{padding:12px;border-radius:8px;margin-top:12px}.notice{background:#edf8f3;border:1px solid #cde8dc;color:#23634d}.error{background:#fff0f0;border:1px solid #eccaca;color:#8d3939}@media(max-width:620px){.invite{grid-template-columns:1fr}.admin{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="brand">VETT<span>TRADE</span> · ADMIN USERS</div><a href="/admin.html">← Admin</a></header><main class="wrap"><section id="authBox" class="card auth"><div class="eyebrow">Owner access</div><h1>Admin login</h1><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary" style="width:100%;margin-top:16px">SIGN IN</button></form><div id="authMsg"></div></section><section id="app" class="hidden"><div class="card"><div class="eyebrow">Owner controls</div><h1>Admin Users</h1><p class="muted">Give trusted people their own VettTrade admin login. They can run normal admin operations, but they cannot add/remove admins or remove the owner account.</p><div class="invite"><div><label>ADMIN EMAIL</label><input id="inviteEmail" type="email" placeholder="cousin@example.com"></div><button id="inviteBtn" class="primary" onclick="invite()">INVITE ADMIN</button></div><div id="msg"></div></div><div class="card"><h2>Current admin access</h2><div id="admins"></div></div></section></main><script>
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),rows=[];async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok||d?.ok===false)throw new Error(d?.message||d?.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString():'Never'}async function fn(action,extra={}){return api('/functions/v1/admin-user-action',{method:'POST',body:JSON.stringify({action,...extra})})}async function boot(){if(!s?.access_token)return;try{const owner=await api('/rest/v1/rpc/is_vett_owner',{method:'POST',body:'{}'});if(!owner)throw new Error('Owner access required');authBox.classList.add('hidden');app.classList.remove('hidden');load()}catch(e){authMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function load(){try{const d=await fn('list');rows=d.admins||[];admins.innerHTML=rows.map(x=>'<div class="admin"><div><b>'+esc(x.email||x.user_id)+'</b><br><span class="status '+(x.role==='owner'?'owner':'ok')+'">'+esc(x.role.toUpperCase())+'</span> <span class="muted" style="font-size:12px">Added '+dt(x.created_at)+' · Last sign in '+dt(x.last_sign_in_at)+'</span></div>'+(x.role==='owner'?'':'<button class="danger" onclick="removeAdmin(\''+x.user_id+'\')">REMOVE ACCESS</button>')+'</div>').join('')||'<p class="muted">No admins found.</p>'}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function invite(){const em=inviteEmail.value.trim();if(!em){msg.innerHTML='<div class="error">Enter the admin email first.</div>';return}inviteBtn.disabled=true;inviteBtn.textContent='SENDING…';msg.innerHTML='<div class="notice">Sending admin invite…</div>';try{const d=await fn('invite',{email:em});inviteEmail.value='';if(d.invited){inviteBtn.textContent='INVITE SENT ✓';msg.innerHTML='<div class="notice"><b>INVITE SENT ✓</b><br>An admin invitation was sent to <b>'+esc(d.email||em)+'</b>. They must use the email link to set their password.</div>'}else{inviteBtn.textContent='ADMIN ADDED ✓';msg.innerHTML='<div class="notice"><b>ADMIN ACCESS ADDED ✓</b><br>'+esc(d.email||em)+' already has a VettTrade account, so no new invitation email was required. They can use their existing password.</div>'}await load();setTimeout(()=>{inviteBtn.disabled=false;inviteBtn.textContent='INVITE ADMIN'},2500)}catch(e){inviteBtn.disabled=false;inviteBtn.textContent='INVITE ADMIN';msg.innerHTML='<div class="error"><b>INVITE NOT SENT.</b><br>'+esc(e.message)+'</div>'}}async function removeAdmin(id){if(!confirm('Remove this admin\'s access?'))return;try{await fn('remove',{userId:id});msg.innerHTML='<div class="notice">Admin access removed.</div>';await load()}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));boot()}catch(x){authMsg.innerHTML='<div class="error">'+esc(x.message)+'</div>'}};boot();
</script></body></html>
