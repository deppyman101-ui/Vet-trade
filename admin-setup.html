<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Access Setup</title><style>:root{--ink:#0b1724;--green:#20b975;--bg:#f4f6f8;--line:#dfe6e3;--muted:#68737e;--red:#a63f3f}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#06191f,#0c2e34);min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink)}.card{width:min(560px,100%);background:#fff;border-radius:18px;padding:28px;border:1px solid var(--line);box-shadow:0 30px 80px #0005}.brand{font-size:22px;font-weight:950;letter-spacing:.5px}.brand span{color:var(--green)}.muted{color:var(--muted);line-height:1.55}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd8d3;border-radius:9px;font:inherit}.primary{width:100%;margin-top:16px;padding:13px;border:0;border-radius:9px;background:#0b1724;color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55}.notice,.error{padding:12px;border-radius:9px;margin-top:13px;line-height:1.5}.notice{background:#edf8f3;border:1px solid #cde8dc;color:#23634d}.error{background:#fff0f0;border:1px solid #eccaca;color:var(--red)}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.links a{text-align:center;text-decoration:none;padding:11px;border-radius:8px;border:1px solid var(--line);font-weight:850;color:var(--ink)}@media(max-width:520px){.links{grid-template-columns:1fr}}</style></head><body><section class="card"><div class="brand">SHARED <span>ADMIN ACCESS</span></div><h1>Create your password</h1><p class="muted">This setup page is only for an email that has already been authorised by the owner. Once complete, the same login can be used for VettTrade, OppSignal and WastePilot.</p><form id="form"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required><label>CREATE PASSWORD</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label>CONFIRM PASSWORD</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button id="submit" class="primary">CREATE ADMIN LOGIN</button></form><div id="msg"></div><div class="links"><a href="/admin.html">VettTrade Admin</a><a href="/wastepilot-admin.html">WastePilot Admin</a></div></section><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2',sb=createClient(U,K,{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[<>&]/g,'');const q=new URLSearchParams(location.search);if(q.get('email'))$('email').value=q.get('email');$('form').onsubmit=async e=>{e.preventDefault();$('msg').innerHTML='';if($('password').value!==$('confirmPassword').value){$('msg').innerHTML='<div class="error">Passwords do not match.</div>';return}const em=$('email').value.trim().toLowerCase();$('submit').disabled=true;$('submit').textContent='CHECKING…';try{const chk=await fetch(U+'/rest/v1/rpc/is_pending_admin_email',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_email:em})});const ok=await chk.json();if(!ok)throw new Error('This email is not currently authorised for admin setup.');$('submit').textContent='CREATING…';const{data,error}=await sb.auth.signUp({email:em,password:$('password').value,options:{emailRedirectTo:'https://www.vetttrade.co.uk/wastepilot-admin.html'}});if(error)throw error;if(data.session){localStorage.setItem('vt_session',JSON.stringify({access_token:data.session.access_token,refresh_token:data.session.refresh_token,user:data.user}));$('msg').innerHTML='<div class="notice"><b>Admin login created ✓</b><br>Opening WastePilot Admin…</div>';setTimeout(()=>location.href='/wastepilot-admin.html',700)}else{$('msg').innerHTML='<div class="notice"><b>Almost done.</b><br>Check '+esc(em)+' for the confirmation email, confirm it, then sign in using the password you just created.</div>';}}catch(x){$('msg').innerHTML='<div class="error">'+esc(x.message||'Unable to create admin login')+'</div>'}finally{$('submit').disabled=false;$('submit').textContent='CREATE ADMIN LOGIN'}};</script></body></html>
