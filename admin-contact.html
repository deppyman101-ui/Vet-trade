<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Inbox | Vett Trade Admin</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--paper:#f4f6f8;--line:#dfe5ea;--muted:#6f7882;--green:#16815d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--paper)}nav{height:72px;background:#fff;border-bottom:1px solid var(--line);padding:0 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:1px}.logo i{font-style:normal;color:var(--gold)}nav a{color:var(--ink);font-weight:800;text-decoration:none}.wrap{max-width:1100px;margin:0 auto;padding:36px 20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.login{max-width:480px;margin:60px auto}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#9b762b}h1{margin:6px 0 22px}label{display:block;font-size:12px;font-weight:900;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cfd7de;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{padding:8px 11px}.request{display:grid;grid-template-columns:1fr auto;gap:20px}.request h3{margin:0 0 5px}.meta{font-size:13px;color:var(--muted)}.message{white-space:pre-wrap;line-height:1.55;margin-top:14px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;background:#eef1f4}.badge.complaint{background:#fff2e8}.badge.privacy{background:#eef5ff}.badge.general{background:#edf8f3}.status{min-width:145px}.empty{text-align:center;padding:40px;color:var(--muted)}.notice{padding:11px 13px;border:1px solid #cde8dc;background:#edf8f3;border-radius:8px;margin-bottom:14px}.error{padding:11px 13px;border:1px solid #efcaca;background:#fff0f0;border-radius:8px;margin-bottom:14px;color:#8f2f2f}@media(max-width:650px){.request{grid-template-columns:1fr}.status{min-width:0}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><nav><div class="logo">VETT <i>TRADE</i> · ADMIN</div><a href="/admin.html">Main admin</a></nav><main class="wrap"><div id="login" class="card login"><div class="eyebrow">Secure admin</div><h1>Contact & dispute inbox</h1><form id="loginForm"><label>EMAIL</label><input id="email" type="email" required><label>PASSWORD</label><input id="password" type="password" required><button class="btn" style="width:100%;margin-top:16px">SIGN IN</button></form><div id="loginMsg"></div></div><div id="app" style="display:none"><div class="top"><div><div class="eyebrow">Contact requests</div><h1 style="margin-bottom:0">Disputes, complaints & privacy</h1></div><div><button class="btn secondary" onclick="loadRequests()">Refresh</button> <button class="btn secondary" onclick="logout()">Sign out</button></div></div><div id="msg"></div><div class="filters"><button class="btn secondary" onclick="setFilter('all')">All</button><button class="btn secondary" onclick="setFilter('new')">New</button><button class="btn secondary" onclick="setFilter('complaint')">Complaints</button><button class="btn secondary" onclick="setFilter('privacy')">Privacy</button></div><div id="list" style="margin-top:18px"></div></div></main>
<script>
const SUPA_URL='https://iymhyxheggqsewpczgjl.supabase.co';const SUPA_KEY='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let session=JSON.parse(localStorage.getItem('vt_admin_session')||'null'),rows=[],filter='all';
async function call(path,opts={}){const h={'apikey':SUPA_KEY,'Content-Type':'application/json',...(opts.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(SUPA_URL+path,{...opts,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error_description||d?.error||'Request failed');return d}
async function login(email,password){const d=await call('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_admin_session',JSON.stringify(session));await loadRequests()}
function logout(){session=null;rows=[];localStorage.removeItem('vt_admin_session');document.getElementById('app').style.display='none';document.getElementById('login').style.display='block'}
async function loadRequests(){try{rows=await call('/rest/v1/rpc/get_admin_contact_requests',{method:'POST',body:'{}'});document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('msg').innerHTML='';render()}catch(e){if(session){document.getElementById('msg').innerHTML='<div class="error">'+e.message+'</div>'}else document.getElementById('loginMsg').innerHTML='<div class="error" style="margin-top:12px">'+e.message+'</div>'}}
function setFilter(v){filter=v;render()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){let data=rows;if(filter==='new')data=rows.filter(r=>r.status==='new');else if(filter==='complaint'||filter==='privacy')data=rows.filter(r=>r.category===filter);const el=document.getElementById('list');if(!data.length){el.innerHTML='<div class="card empty">No matching requests.</div>';return}el.innerHTML=data.map(r=>`<div class="card request"><div><span class="badge ${esc(r.category)}">${esc(r.category)}</span><h3>${esc(r.name)}</h3><div class="meta">${esc(r.email)} · ${new Date(r.created_at).toLocaleString()}</div><div class="message">${esc(r.message)}</div></div><div class="status"><label>STATUS</label><select onchange="updateStatus('${r.id}',this.value,this)"><option value="new" ${r.status==='new'?'selected':''}>New</option><option value="in_progress" ${r.status==='in_progress'?'selected':''}>In progress</option><option value="closed" ${r.status==='closed'?'selected':''}>Closed</option></select></div></div>`).join('')}
async function updateStatus(id,status,select){select.disabled=true;try{await call('/rest/v1/rpc/admin_update_contact_request_status',{method:'POST',body:JSON.stringify({p_request_id:id,p_status:status})});const r=rows.find(x=>x.id===id);if(r)r.status=status;document.getElementById('msg').innerHTML='<div class="notice">Request status updated.</div>';render()}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+e.message+'</div>';select.disabled=false}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();document.getElementById('loginMsg').innerHTML='';try{await login(document.getElementById('email').value.trim(),document.getElementById('password').value)}catch(x){document.getElementById('loginMsg').innerHTML='<div class="error" style="margin-top:12px">'+x.message+'</div>'}};
if(session?.access_token)loadRequests();
</script></body></html>
