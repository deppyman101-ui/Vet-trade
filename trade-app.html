<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1724"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VettTrade"><link rel="manifest" href="/trade-manifest.webmanifest"><link rel="icon" href="/trade-icon.svg"><title>VettTrade Trade App</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f3f5f7;--card:#fff;--line:#dfe5ea;--muted:#697581;--green:#16785a;--red:#b94747}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body{padding-bottom:86px}.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 16px #0002}.brand{font-weight:950;letter-spacing:.7px}.brand span{color:var(--gold)}.iconBtn{border:0;background:#ffffff18;color:#fff;border-radius:10px;padding:9px 11px;font-weight:900}.wrap{max-width:760px;margin:auto;padding:18px}.hello{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin:5px 0 15px}.hello h1{font-size:27px;margin:3px 0}.muted{color:var(--muted);line-height:1.5}.install{background:#fff8e7;border:1px solid #ead8a9;border-radius:14px;padding:14px;margin-bottom:14px}.install button{margin-top:9px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;font-weight:850}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.job{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin:11px 0;box-shadow:0 3px 10px #0b172408}.jobTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;background:#eef2f5}.badge.hot{background:#fff1dc;color:#805f1f}.badge.done{background:#e9f6f0;color:var(--green)}.job h2{font-size:18px;margin:9px 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.desc{margin:12px 0;font-size:14px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.secondary{border-radius:11px;padding:13px 14px;font-weight:950;text-decoration:none;text-align:center}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.empty{background:#fff;border:1px dashed #ccd4db;border-radius:16px;padding:28px;text-align:center;color:var(--muted)}.login{max-width:470px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px;font:inherit}.login button{width:100%}.notice,.error{padding:12px;border-radius:10px;margin:12px 0;font-size:13px}.notice{background:#edf8f3;color:#23634d}.error{background:#fff0f0;color:#8d3939}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.navItem{text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:850;padding:8px 4px;border-radius:10px}.navItem strong{display:block;font-size:19px;margin-bottom:2px}.navItem.active{background:#eef2f5;color:var(--ink)}.hidden{display:none!important}@media(min-width:800px){.bottom{left:50%;transform:translateX(-50%);max-width:760px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}.wrap{padding-top:25px}}</style></head><body><header class="top"><div class="brand">VETT<span>TRADE</span> · FIELD</div><button class="iconBtn" onclick="refreshAll()">↻ Refresh</button></header><main class="wrap"><section id="loginBox" class="login hidden"><h1>Trade sign in</h1><p class="muted">Sign in once, then add VettTrade to your phone home screen.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="primary">SIGN IN</button></form><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="hello"><div><small class="muted">FIELD APP</small><h1 id="helloTitle">Your jobs</h1><div id="tradeState" class="muted"></div></div><button class="secondary" onclick="logout()">Sign out</button></div><div id="installBox" class="install hidden"><b>Add VettTrade to your phone</b><div id="installText" class="muted" style="font-size:12px;margin-top:4px">Open jobs like an app from your home screen.</div><button id="installBtn" class="secondary">ADD TO HOME SCREEN</button></div><div class="chips"><button class="chip active" data-filter="open" onclick="setFilter('open',this)">Open jobs</button><button class="chip" data-filter="all" onclick="setFilter('all',this)">All</button><button class="chip" data-filter="completed" onclick="setFilter('completed',this)">Completed</button></div><div id="jobs"></div><div id="appMsg"></div></section></main><nav class="bottom"><a class="navItem active" href="/trade-app.html"><strong>🧰</strong>Jobs</a><a class="navItem" href="/trade-hub.html"><strong>£</strong>Quotes & Pay</a><a class="navItem" href="/trade-portal.html"><strong>👤</strong>Profile</a></nav><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),profile=null,allJobs=[],filter='open',installPrompt=null;async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function statusLabel(s){return({accepted:'Assigned',contacted:'Contacted',quoted:'Quoted',won:'Agreed',completed:'Completed',lost:'Closed'})[String(s||'').toLowerCase()]||s}function logout(){localStorage.removeItem('vt_session');location.reload()}function setFilter(f,b){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderJobs()}async function boot(){if(!s?.access_token){loginBox.classList.remove('hidden');return}try{const p=await api('/rest/v1/rpc/get_my_verification_profile',{method:'POST',body:'{}'});profile=p?.[0]||null;if(!profile){loginBox.classList.remove('hidden');app.classList.add('hidden');return}app.classList.remove('hidden');helloTitle.textContent=profile.business_name||'Your jobs';tradeState.textContent=profile.active?'Active VettTrade partner':'Account not active yet';if(!profile.active){jobs.innerHTML='<div class="empty"><b>Finish onboarding first.</b><br><br><a class="secondary" href="/trade-portal.html">OPEN FULL PORTAL</a></div>';return}await refreshAll()}catch(e){appMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function refreshAll(){if(!s?.access_token)return;try{allJobs=await api('/rest/v1/rpc/get_trade_jobs',{method:'POST',body:'{}'});renderJobs()}catch(e){appMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function renderJobs(){let arr=allJobs;if(filter==='open')arr=arr.filter(j=>!['completed','lost'].includes(String(j.status).toLowerCase()));if(filter==='completed')arr=arr.filter(j=>String(j.status).toLowerCase()==='completed');jobs.innerHTML=arr.length?arr.map(j=>{const st=String(j.status).toLowerCase();return '<article class="job"><div class="jobTop"><div><span class="badge '+(st==='completed'?'done':j.urgency==='Emergency'?'hot':'')+'">'+esc(statusLabel(st))+'</span><h2>'+esc(j.trade_category)+' · '+esc(j.job_type)+'</h2><div class="meta">'+esc(j.reference)+' · '+esc(j.area)+' · '+esc(j.urgency)+'</div></div></div><div class="desc">'+esc(j.description)+'</div><div class="actions"><a class="primary" href="/trade-job.html?id='+encodeURIComponent(j.id)+'">OPEN JOB</a>'+(j.customer_phone?'<a class="secondary" href="tel:'+encodeURIComponent(j.customer_phone)+'">CALL</a>':'')+'</div></article>'}).join(''):'<div class="empty">No '+(filter==='completed'?'completed':'open')+' jobs right now.</div>'}loginForm.onsubmit=async e=>{e.preventDefault();loginMsg.innerHTML='';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));loginBox.classList.add('hidden');await boot()}catch(x){loginMsg.innerHTML='<div class="error">'+esc(x.message)+'</div>'}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBox.classList.remove('hidden')});installBtn.onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBox.classList.add('hidden')}else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){installText.textContent='On iPhone: tap Share, then “Add to Home Screen”.'} };if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)installBox.classList.remove('hidden');if('serviceWorker'in navigator)navigator.serviceWorker.register('/trade-sw.js').catch(()=>{});boot();</script></body></html>
