<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VettTrade Trade Agreement</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e2e7eb;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 4%}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.top a{color:var(--ink);text-decoration:none;font-weight:800;font-size:13px}.wrap{max-width:820px;margin:38px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:14px 0}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.muted{color:var(--muted)}.status{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#fff5de;color:#87671f}.ok{background:#e8f6ef;color:var(--green)}.check{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf0f2}.check:last-child{border-bottom:0}.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}.check label{font-weight:700;line-height:1.45}.primary{border:0;background:var(--ink);color:#fff;font-weight:900;padding:13px 17px;border-radius:9px;cursor:pointer;width:100%;margin-top:18px}.primary:disabled{opacity:.55;cursor:not-allowed}.notice,.error{padding:12px;border-radius:8px;margin:12px 0}.notice{background:#edf8f3;border:1px solid #cde8dc;color:#23634d}.error{background:#fff0f0;border:1px solid #eccaca;color:#8d3939}.hidden{display:none!important}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div class="top"><div class="brand">VETT <span>TRADE</span> · AGREEMENT</div><a href="/trade-portal.html">← Trade portal</a></div><div class="wrap"><div class="card"><div class="eyebrow">Final onboarding step</div><h1>VettTrade trade agreement</h1><p class="muted">Before your account can be activated, confirm that you understand how VettTrade leads, quoting and VettPay work.</p><div id="state"></div></div><div id="agreementCard" class="card hidden"><div class="summary"><h2 style="margin:0">Agreement checklist</h2><span class="status">Version 2026-08-v1</span></div><form id="agreementForm"><div class="check"><input id="lead_fees" type="checkbox"><label for="lead_fees">I understand that VettTrade leads are paid leads.</label></div><div class="check"><input id="customer_unlock" type="checkbox"><label for="customer_unlock">I understand customer details are unlocked only after the lead fee is paid.</label></div><div class="check"><input id="quote_through_vetttrade" type="checkbox"><label for="quote_through_vetttrade">I understand VettTrade-sourced jobs must be quoted through VettTrade.</label></div><div class="check"><input id="vettpay_required" type="checkbox"><label for="vettpay_required">I understand customer payments for VettTrade-sourced jobs must go through VettPay.</label></div><div class="check"><input id="completion_fee_15" type="checkbox"><label for="completion_fee_15">I accept the 15% VettTrade completion fee on jobs paid through VettPay.</label></div><div class="check"><input id="fee_deducted_before_payout" type="checkbox"><label for="fee_deducted_before_payout">I understand the VettTrade completion fee is deducted before my payout.</label></div><div class="check"><input id="no_private_payment_bypass" type="checkbox"><label for="no_private_payment_bypass">I will not ask VettTrade customers to pay me privately to avoid VettTrade fees.</label></div><div class="check"><input id="quote_variations" type="checkbox"><label for="quote_variations">I will keep quotes accurate and record agreed extra work or price changes before requesting payment.</label></div><div class="check"><input id="qualified_insured_work" type="checkbox"><label for="qualified_insured_work">I will only carry out work I am qualified and insured to perform.</label></div><div class="check"><input id="keep_details_current" type="checkbox"><label for="keep_details_current">I will keep my insurance, licences and business details up to date.</label></div><div class="check"><input id="complaints_refunds_disputes" type="checkbox"><label for="complaints_refunds_disputes">I understand complaints, refunds and payment disputes may be reviewed through VettTrade.</label></div><div class="check"><input id="terms_payment_terms" type="checkbox"><label for="terms_payment_terms">I agree to the current VettTrade Trade Terms and Payment Terms.</label></div><button id="acceptBtn" class="primary" disabled>I AGREE & CONTINUE</button></form><div id="msg"></div></div></div><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2',VERSION='2026-08-v1';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),p=null;const ids=['lead_fees','customer_unlock','quote_through_vetttrade','vettpay_required','completion_fee_15','fee_deducted_before_payout','no_private_payment_bypass','quote_variations','qualified_insured_work','keep_details_current','complaints_refunds_disputes','terms_payment_terms'];function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function sync(){acceptBtn.disabled=!ids.every(id=>document.getElementById(id).checked)}ids.forEach(id=>document.getElementById(id).addEventListener('change',sync));async function boot(){if(!s?.access_token){state.innerHTML='<div class="error">Please sign in through the Trade Portal first.</div>';return}try{const a=await api('/rest/v1/rpc/get_my_verification_profile',{method:'POST',body:'{}'});p=a?.[0]||null;if(!p){state.innerHTML='<div class="error">Trade profile not found.</div>';return}if(p.trade_terms_version===VERSION&&p.trade_terms_accepted_at){state.innerHTML='<div class="notice"><b>Agreement accepted ✓</b><br>'+esc(p.business_name)+' accepted version '+VERSION+' on '+new Date(p.trade_terms_accepted_at).toLocaleString()+'.</div><a href="/trade-portal.html" style="font-weight:900;color:#0b1724">Return to Trade Portal →</a>';return}if(p.verification_status!=='verified'||!p.identity_verified||!p.public_liability_verified||(p.wants_gas_work&&!p.gas_safe_verified)){state.innerHTML='<div class="error"><b>Verification must be completed first.</b><br>Once VettTrade approves your verification, return here to accept the trade agreement.</div>';return}state.innerHTML='<div class="notice"><b>Verification passed ✓</b><br>'+esc(p.business_name)+' can now complete the final agreement step.</div>';agreementCard.classList.remove('hidden')}catch(e){state.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}agreementForm.onsubmit=async e=>{e.preventDefault();if(!ids.every(id=>document.getElementById(id).checked))return;acceptBtn.disabled=true;acceptBtn.textContent='SAVING…';const acceptance={};ids.forEach(id=>acceptance[id]=document.getElementById(id).checked);try{await api('/rest/v1/rpc/accept_my_trade_agreement',{method:'POST',body:JSON.stringify({p_version:VERSION,p_acceptance:acceptance})});msg.innerHTML='<div class="notice"><b>Accepted ✓</b> Your agreement has been recorded. VettTrade can now activate your account.</div>';agreementForm.querySelectorAll('input').forEach(x=>x.disabled=true);acceptBtn.textContent='AGREEMENT ACCEPTED'}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>';acceptBtn.disabled=false;acceptBtn.textContent='I AGREE & CONTINUE'}};boot();</script></body></html>
