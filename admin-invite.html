<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up VettTrade Admin</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:min(520px,100%)}.brand{font-weight:950}.brand span{color:var(--gold)}.muted{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d6dde3;border-radius:8px;font:inherit}.primary{width:100%;padding:13px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:900;margin-top:16px}.notice,.error{padding:12px;border-radius:8px;margin-top:12px}.notice{background:#edf8f3}.error{background:#fff0f0}</style></head><body><section class="card"><div class="brand">VETT<span>TRADE</span> · ADMIN</div><h1>Set your admin password</h1><p class="muted">Your VettTrade admin access has been invited by the owner. Choose your own password below.</p><form id="form"><label>NEW PASSWORD</label><input id="password" type="password" minlength="8" required><label>CONFIRM PASSWORD</label><input id="confirmPassword" type="password" minlength="8" required><button id="submit" class="primary">SET PASSWORD & OPEN ADMIN</button></form><div id="msg"></div></section><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';const sb=createClient(U,K,{auth:{detectSessionInUrl:true,persistSession:true}});const form=document.getElementById('form'),msg=document.getElementById('msg'),submit=document.getElementById('submit');
async function ensureSession(){const q=new URLSearchParams(location.search);if(q.get('code')){try{await sb.auth.exchangeCodeForSession(q.get('code'))}catch{}}const {data}=await sb.auth.getSession();return data.session}
const session=await ensureSession();if(!session){msg.innerHTML='<div class="error">This invite link is invalid or has expired. Ask the VettTrade owner to send a new admin invite.</div>';form.style.display='none'}
form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirmPassword.value){msg.innerHTML='<div class="error">Passwords do not match.</div>';return}submit.disabled=true;submit.textContent='SAVING…';const {data,error}=await sb.auth.updateUser({password:password.value});if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';submit.disabled=false;submit.textContent='SET PASSWORD & OPEN ADMIN';return}if(data?.user){const {data:sess}=await sb.auth.getSession();if(sess?.session)localStorage.setItem('vt_session',JSON.stringify({access_token:sess.session.access_token,refresh_token:sess.session.refresh_token,user:sess.session.user}))}location.href='/admin.html'};
</script></body></html>
