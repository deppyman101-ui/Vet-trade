<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VettTrade Admin · Customers</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 4%}.brand{font-weight:950}.brand span{color:var(--gold)}.top a{color:inherit;text-decoration:none;font-weight:850}.wrap{max-width:1100px;margin:auto;padding:34px 20px}.auth,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.auth{max-width:500px;margin:50px auto}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.muted{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6dde3;border-radius:8px;font:inherit}textarea{min-height:80px}.primary,.secondary{border-radius:8px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.hidden{display:none!important}.search{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.notice,.error{padding:12px;border-radius:8px;margin-top:12px}.notice{background:#edf8f3}.error{background:#fff0f0}.profile{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.stat{padding:8px 10px;border-radius:10px;background:#f6f8fa;font-size:12px}.job{border-top:1px solid var(--line);padding:14px 0}.job:first-child{border-top:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2f5}.completed{background:#e8f6ef;color:var(--green)}.timeline{border-left:2px solid #e2e7eb;padding-left:14px}.note{margin:12px 0}.note small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sectionTitle{margin-top:26px}@media(max-width:700px){.search,.grid{grid-template-columns:1fr}.profile{flex-direction:column}}</style></head><body><header class="top"><div class="brand">VETT<span>TRADE</span> · CUSTOMERS</div><div><a href="/admin.html">Dashboard</a> · <a href="/admin-create-job.html">Create job</a></div></header><main class="wrap"><div id="authBox" class="auth"><div class="eyebrow">Owner access</div><h1>Admin login</h1><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary" style="width:100%;margin-top:16px">SIGN IN</button></form><div id="authMsg"></div></div><div id="app" class="hidden"><div class="eyebrow">CRM-lite</div><h1>Customer records</h1><p class="muted">Search by phone number. See every VettTrade job, including completed work, plus callback and support notes.</p><div class="card"><div class="search"><div><label>PHONE NUMBER</label><input id="searchPhone" placeholder="07..."></div><button class="primary" onclick="lookup()">FIND CUSTOMER</button></div><div id="searchMsg"></div></div><div id="record" class="hidden"><div class="card sectionTitle"><div class="profile"><div><div class="eyebrow">Customer</div><h2 id="custName" style="margin:5px 0"></h2><div id="custContact" class="muted"></div><div id="custStats" class="stats"></div></div><a class="secondary" id="newJobLink" href="/admin-create-job.html">CREATE NEW JOB</a></div></div><div class="grid"><div class="card sectionTitle"><h2>Job history</h2><div id="jobHistory"></div></div><div><div class="card sectionTitle"><h2>Add callback / note</h2><label>TYPE</label><select id="noteType"><option value="callback">Callback</option><option value="customer_call">Customer called</option><option value="chase">Chase / follow-up</option><option value="complaint">Complaint</option><option value="new_repair">New repair enquiry</option><option value="note">General note</option></select><label>NOTE</label><textarea id="noteText" placeholder="What did they say? What happens next?"></textarea><button class="primary" style="margin-top:12px" onclick="addNote()">SAVE TO CUSTOMER HISTORY</button><div id="noteMsg"></div></div><div class="card sectionTitle"><h2>Call / interaction history</h2><div id="interactionHistory" class="timeline"></div></div></div></div></div></div></main><script>
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),current=null;async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString():'—'}async function boot(){if(!s?.access_token)return;try{if(!await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'}))throw new Error('Admin access required');authBox.classList.add('hidden');app.classList.remove('hidden')}catch(e){authMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function lookup(){searchMsg.innerHTML='';try{const d=await api('/rest/v1/rpc/admin_customer_lookup',{method:'POST',body:JSON.stringify({p_phone:searchPhone.value.trim()})});if(!d?.found){record.classList.add('hidden');searchMsg.innerHTML='<div class="error">No existing customer record found for that phone number.</div>';return}current=d;render()}catch(e){searchMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(){const c=current.customer,j=current.jobs||[],i=current.interactions||[];record.classList.remove('hidden');custName.textContent=c.full_name;custContact.textContent=[c.phone,c.email].filter(Boolean).join(' · ');custStats.innerHTML='<span class="stat"><b>'+j.length+'</b> total jobs</span><span class="stat"><b>'+j.filter(x=>x.status==='completed').length+'</b> completed</span><span class="stat">Customer since '+new Date(c.created_at).toLocaleDateString()+'</span>';newJobLink.href='/admin-create-job.html?phone='+encodeURIComponent(c.phone)+'&name='+encodeURIComponent(c.full_name)+(c.email?'&email='+encodeURIComponent(c.email):'');jobHistory.innerHTML=j.length?j.map(x=>'<div class="job"><span class="badge '+(x.status==='completed'?'completed':'')+'">'+esc(x.status)+'</span><h3 style="margin:7px 0 4px">'+esc(x.trade_category)+' · '+esc(x.job_type)+'</h3><div class="muted" style="font-size:12px">'+esc(x.reference)+' · '+esc(x.area)+' · '+dt(x.created_at)+(x.assigned_business_name?' · '+esc(x.assigned_business_name):'')+(x.completed_at?'<br>Completed '+dt(x.completed_at):'')+'</div></div>').join(''):'<p class="muted">No jobs.</p>';interactionHistory.innerHTML=i.length?i.map(x=>'<div class="note"><b>'+esc(x.type.replaceAll('_',' '))+'</b><br><span>'+esc(x.note||'')+'</span><br><small>'+dt(x.created_at)+'</small></div>').join(''):'<p class="muted">No callback notes yet.</p>'}
async function addNote(){if(!current)return;try{await api('/rest/v1/rpc/admin_add_customer_interaction',{method:'POST',body:JSON.stringify({p_customer_id:current.customer.id,p_lead_id:null,p_type:noteType.value,p_note:noteText.value.trim()})});noteText.value='';noteMsg.innerHTML='<div class="notice">Saved to customer history.</div>';await lookup()}catch(e){noteMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));await boot()}catch(x){authMsg.innerHTML='<div class="error">'+esc(x.message)+'</div>'}};const q=new URLSearchParams(location.search);if(q.get('phone'))searchPhone.value=q.get('phone');boot().then(()=>{if(q.get('phone')&&s?.access_token)lookup()});
</script></body></html>
