<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<title>NewAddy Payment</title>
<style>
:root{--navy:#17324d;--coral:#ef6c57;--cream:#f6f2eb;--muted:#66727d;--line:#e3e5e4;--ok:#e7f5ea;--warn:#fff2d9;--bad:#fbe6e3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;padding:22px}.card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 20px 55px rgba(23,50,77,.10)}.brand{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:800;color:var(--navy)}.brand em{font-style:normal;color:var(--coral)}.badge{display:inline-block;margin-top:24px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.paid{background:var(--ok);color:#28603b}.pending,.cancelled{background:var(--warn);color:#7d5b17}.error{background:var(--bad);color:#873b31}h1{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:42px;line-height:1.05;margin:13px 0 12px}p{color:var(--muted);line-height:1.65;font-size:16px}.ref{font-weight:900;color:var(--navy)}a{display:inline-block;margin-top:13px;background:var(--navy);color:#fff;text-decoration:none;font-weight:850;border-radius:10px;padding:13px 17px}@media(max-width:600px){.card{padding:27px}h1{font-size:35px}}
</style>
</head>
<body>
<main class="card"><div class="brand">New<em>Addy</em></div><div id="badge" class="badge">Payment</div><h1 id="title">Checking your payment…</h1><p id="copy">Please keep this page open for a moment.</p><p id="ref"></p><a href="/nextkey/">Back to NewAddy</a></main>
<script>
const q=new URLSearchParams(location.search),status=q.get('status')||'pending',ref=q.get('ref')||'';
const badge=document.getElementById('badge'),title=document.getElementById('title'),copy=document.getElementById('copy'),r=document.getElementById('ref');
const states={
 paid:['paid','Payment received','Thank you. Your £79 NewAddy successful-introduction fee has been received and recorded.'],
 pending:['pending','Payment is being confirmed','Your payment has not been confirmed yet. If you completed payment, NewAddy will verify it against the Stripe payment record.'],
 cancelled:['cancelled','Payment not completed','No payment was taken. You can use the payment link again when you are ready.'],
 error:['error','We could not confirm the payment','Please contact NewAddy and quote your introduction reference so we can check the payment securely.']
};
const s=states[status]||states.pending;badge.className='badge '+s[0];badge.textContent=status==='paid'?'PAID':status.toUpperCase();title.textContent=s[1];copy.textContent=s[2];if(ref)r.innerHTML='Reference: <span class="ref">'+ref.replace(/[&<>"']/g,'')+'</span>';
</script>
</body>
</html>
