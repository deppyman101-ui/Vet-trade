tton class="bigAction" onclick="openEvidence('arrived')"><strong>📍</strong>ARRIVED</button><button class="bigAction noaccess" onclick="openEvidence('no_access')"><strong>🚪</strong>NO ACCESS</button><button class="bigAction pending" onclick="openContinuation('repair_pending')"><strong>⏸️</strong>CAN'T FINISH TODAY</button><button id="completeAction" class="bigAction complete" onclick="openEvidence('completion')"><strong>✅</strong>COMPLETE JOB</button></div><div id="continuationFlow"></div><p class="muted" style="font-size:12px;margin-bottom:0">One repair stays under this job reference until it is completed or closed.</p></section><section class="card"><div class="eyebrow">EVIDENCE TRAIL</div><h2>Site activity</h2><div id="events"><div class="muted">No site evidence yet.</div></div></section></main><nav class="bottom"><a class="navItem" href="/trade-app.html"><strong>🧰</strong>Jobs</a><a class="navItem" href="/trade-hub.html"><strong>£</strong>Quotes & Pay</a><a class="navItem" href="/trade-portal.html"><strong>👤</strong>Profile</a></nav><div id="sheet" class="sheet hidden"><div class="sheetCard"><div class="sheetHead"><div><div id="sheetEyebrow" class="eyebrow"></div><h2 id="sheetTitle" style="margin:5px 0"></h2></div><button class="close" onclick="closeSheet()">×</button></div><p id="sheetHelp" class="muted"></p><div id="reasonRow" class="hidden"><label>WHY CAN'T THE REPAIR BE FINISHED TODAY?</label><select id="reasonSelect"><option value="part_required">Part / material required</option><option value="more_work_required">More extensive work required</option><option value="revised_quote_required">Revised quote required</option><option value="specialist_required">Specialist / second trade required</option><option value="repair_pending">Customer decision / other pending reason</option></select></div><div id="partRow" class="hidden"><label>PART / MATERIAL DETAILS</label><input id="partDetails" placeholder="e.g. 35mm shower cartridge"></div><div id="returnRow" class="hidden"><label>RETURN VISIT</label><input id="returnAt" type="datetime-local"></div><div id="safeRow" class="hidden"><label>IS THE PROPERTY SAFE TO LEAVE?</label><div class="safeGrid"><label class="safeOpt"><input type="radio" name="safe" value="true"> Yes · safe</label><label class="safeOpt"><input type="radio" name="safe" value="false"> No · issue remains unsafe</label></div></div><div class="photoPick"><input id="photoInput" type="file" accept="image/*" capture="environment" multiple><label for="photoInput" style="margin:0;cursor:pointer"><b>📷 TAKE / ADD PHOTOS</b><br><span class="muted" style="font-size:12px">Add evidence if useful. No Access and Completion require photos.</span></label><div id="preview" class="preview"></div></div><label id="noteLabel" for="eventNote">NOTE</label><textarea id="eventNote"></textarea><div id="contactRow" class="check hidden"><input id="attemptedContact" type="checkbox"><label for="attemptedContact" style="margin:0">I attempted to contact the customer / occupier.</label></div><button id="saveEvent" class="primary" style="width:100%;margin-top:14px" onclick="submitSheet()">SAVE</button><div id="sheetMsg"></div></div></div><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),job=null,siteEvents=[],mode=null,selected=[],sheetType='evidence';const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||d?.msg||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString():'—'}function statusLabel(v){return({accepted:'Assigned',contacted:'Contacted',quoted:'Quoted',won:'Agreed',completed:'Completed',lost:'Closed'})[String(v||'').toLowerCase()]||v}function stageLabel(v){return({standard:'Standard repair',active:'Work can continue',on_site:'On site',no_access:'No access',repair_pending:'Repair pending',part_required:'Part required',part_ordered:'Part ordered',more_work_required:'More work required',revised_quote_required:'Revised quote required',specialist_required:'Specialist required',return_booked:'Return booked',return_arrived:'Return visit arrived',completed:'Completed'})[String(v||'').toLowerCase()]||String(v||'').replaceAll('_',' ')}function eventLabel(v){return({arrived:'ARRIVED ON SITE',no_access:'NO ACCESS CARD',completion:'JOB COMPLETED',repair_pending:'REPAIR PENDING',part_required:'PART REQUIRED',part_ordered:'PART ORDERED',more_work_required:'MORE WORK REQUIRED',revised_quote_required:'REVISED QUOTE REQUIRED',specialist_required:'SPECIALIST REQUIRED',return_booked:'RETURN VISIT BOOKED',return_arrived:'RETURN VISIT ARRIVED',resume_work:'WORK RESUMED'})[v]||v.replaceAll('_',' ').toUpperCase()}async function boot(){if(!s?.access_token||!id){location.href='/trade-app.html';return}try{await refresh()}catch(e){$('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function refresh(){const jobs=await api('/rest/v1/rpc/get_trade_jobs',{method:'POST',body:'{}'});job=jobs.find(x=>x.id===id);if(!job)throw new Error('This job is not available to your trade account.');renderJob();await loadEvents()}function renderJob(){const st=String(job.status).toLowerCase(),rs=String(job.repair_stage||'standard').toLowerCase();$('jobCard').innerHTML='<div><span class="badge '+(st==='completed'?'green':st==='lost'?'red':'amber')+'">'+esc(statusLabel(st))+'</span> <span class="badge blue">'+esc(stageLabel(rs))+'</span><h1>'+esc(job.trade_category)+' · '+esc(job.job_type)+'</h1><div class="meta">'+esc(job.reference)+' · '+esc(job.area)+' · '+esc(job.urgency)+' · '+esc(job.property_type||'Property')+'</div><p>'+esc(job.description)+'</p>'+(job.continuation_note?'<div class="flow"><strong>'+esc(stageLabel(rs))+'</strong><div class="meta">'+esc(job.continuation_note)+'</div>'+(job.part_details?'<div class="meta">Part/material: '+esc(job.part_details)+'</div>':'')+(job.return_visit_at?'<div class="meta">Return: '+esc(dt(job.return_visit_at))+'</div>':'')+(job.property_safe!==null?'<div class="meta">Property safe to leave: '+(job.property_safe?'Yes':'No')+'</div>':'')+'</div>':'')+'</div>'+(job.customer_name?'<div class="customer"><div><div class="eyebrow">CUSTOMER</div><b>'+esc(job.customer_name)+'</b><div class="meta">'+esc(job.customer_phone||'')+(job.customer_email?'<br>'+esc(job.customer_email):'')+'</div></div>'+(job.customer_phone?'<a class="secondary" href="tel:'+encodeURIComponent(job.customer_phone)+'">📞 CALL CUSTOMER</a>':'')+'</div>':'');$('actionsCard').classList.toggle('hidden',['completed','lost'].includes(st));$('completeAction').disabled=st!=='won';$('completeAction').style.opacity=st==='won'?'1':'.45';renderContinuationFlow()}function renderContinuationFlow(){if(!job)return;const rs=String(job.repair_stage||'standard'),st=String(job.status||'');let html='';if(['part_required','part_ordered','repair_pending','more_work_required','revised_quote_required','specialist_required','return_booked','return_arrived'].includes(rs)){html='<div class="flow"><strong>CONTINUATION CONTROLS</strong><div class="meta">Keep this repair under '+esc(job.reference)+'.</div><div class="flowActions">';if(rs==='part_required')html+='<button class="secondary" onclick="openContinuation(\'part_ordered\')">📦 PART ORDERED</button>';if(['part_required','part_ordered','repair_pending','more_work_required','revised_quote_required','specialist_required'].includes(rs))html+='<button class="secondary" onclick="openContinuation(\'return_booked\')">📅 BOOK RETURN</button>';if(rs==='return_booked')html+='<button class="primary" onclick="openContinuation(\'return_arrived\')">📍 RETURN ARRIVED</button>';if(rs==='revised_quote_required'||rs==='more_work_required')html+='<a class="secondary" href="/trade-hub.html?job='+encodeURIComponent(job.id)+'">£ SEND REVISED QUOTE</a>';if(rs!=='return_booked'&&rs!=='return_arrived')html+='<button class="secondary" onclick="openContinuation(\'resume_work\')">▶ RESUME WORK</button>';html+='</div></div>'}$('continuationFlow').innerHTML=html}async function loadEvents(){try{const r=await fetch(U+'/functions/v1/job-evidence-links',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({leadId:id})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load evidence');siteEvents=d.events||[];renderEvents()}catch(e){$('events').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function renderEvents(){$('events').innerHTML=siteEvents.length?siteEvents.map(e=>'<div class="event '+esc(e.event_type)+'"><b>'+esc(eventLabel(e.event_type))+'</b><div class="meta">'+dt(e.created_at)+(e.trade_name?' · '+esc(e.trade_name):'')+'</div>'+(e.attempted_contact?'<div class="meta">✓ Contact attempt recorded</div>':'')+(e.note?'<p style="margin:7px 0">'+esc(e.note)+'</p>':'')+(e.photos?.length?'<div class="photos">'+e.photos.map(p=>p.url?'<a href="'+esc(p.url)+'" target="_blank"><img src="'+esc(p.url)+'" alt="Job evidence"></a>':'').join('')+'</div>':'')+'</div>').join(''):'<div class="muted">No site evidence yet.</div>'}function resetSheet(){selected=[];$('photoInput').value='';$('preview').innerHTML='';$('eventNote').value='';$('partDetails').value=job?.part_details||'';$('returnAt').value='';$('attemptedContact').checked=false;document.querySelectorAll('input[name=safe]').forEach(x=>x.checked=false);['reasonRow','partRow','returnRow','safeRow','contactRow'].forEach(x=>$(x).classList.add('hidden'));$('sheetMsg').innerHTML=''}function openEvidence(m){if(m==='completion'&&String(job.status).toLowerCase()!=='won'){$('msg').innerHTML='<div class="error">The customer must accept the current repair quote before you can complete the job.</div>';return}sheetType='evidence';mode=m;resetSheet();$('sheetEyebrow').textContent=m==='arrived'?'ATTENDANCE':m==='no_access'?'NO ACCESS CARD':'COMPLETION EVIDENCE';$('sheetTitle').textContent=m==='arrived'?'Record arrival':m==='no_access'?'Record no access':'Complete this job';$('sheetHelp').textContent=m==='arrived'?'Timestamp your arrival. Add a photo if useful.':m==='no_access'?'Take at least one photo, confirm contact was attempted and add a note.':'Take at least one completion photo and add a short work summary.';$('contactRow').classList.toggle('hidden',m!=='no_access');$('noteLabel').textContent=m==='completion'?'WORK COMPLETED':m==='no_access'?'NO ACCESS NOTE':'ARRIVAL NOTE (OPTIONAL)';$('saveEvent').textContent=m==='arrived'?'SAVE ARRIVAL':m==='no_access'?'CREATE NO ACCESS CARD':'SAVE COMPLETION';$('sheet').classList.remove('hidden')}function openContinuation(action){sheetType='continuation';mode=action;resetSheet();$('sheetEyebrow').textContent='REPAIR CONTINUATION';$('sheetTitle').textContent=action==='return_booked'?'Book return visit':action==='return_arrived'?'Record return arrival':action==='part_ordered'?'Mark part ordered':action==='resume_work'?'Resume repair':'Repair cannot be finished today';$('sheetHelp').textContent='Keep the same job open and record the next step clearly.';if(action==='repair_pending'){$('reasonRow').classList.remove('hidden');$('safeRow').classList.remove('hidden');$('noteLabel').textContent='DIAGNOSIS / WHAT HAPPENS NEXT';$('eventNote').placeholder='e.g. Unable to complete today; replacement cartridge required'}else if(action==='part_ordered'){$('partRow').classList.remove('hidden');$('noteLabel').textContent='ORDER NOTE (OPTIONAL)'}else if(action==='return_booked'){$('returnRow').classList.remove('hidden');$('noteLabel').textContent='RETURN VISIT NOTE (OPTIONAL)'}else if(action==='return_arrived'){$('noteLabel').textContent='RETURN ARRIVAL NOTE (OPTIONAL)'}else if(action==='resume_work'){$('noteLabel').textContent='RESUME NOTE (OPTIONAL)'}$('saveEvent').textContent='SAVE CONTINUATION';$('sheet').classList.remove('hidden')}function closeSheet(){$('sheet').classList.add('hidden')}$('reasonSelect').onchange=()=>{$('partRow').classList.toggle('hidden',$('reasonSelect').value!=='part_required')};$('photoInput').onchange=()=>{selected=[...$('photoInput').files].slice(0,6);$('preview').innerHTML=selected.map(f=>'<img src="'+URL.createObjectURL(f)+'">').join('')};async function prepareFile(file){if(file.size<=7.5*1024*1024)return file;const img=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.82));if(blob)return new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'});throw new Error('One photo is too large.')}async function uploadPhotos(){const paths=[];for(const original of selected){const file=await prepareFile(original),ext=(file.name.split('.').pop()||'jpg').toLowerCase(),safe=['jpg','jpeg','png','webp','heic','heif'].includes(ext)?ext:'jpg',path=s.user.id+'/'+id+'/'+mode+'/'+crypto.randomUUID()+'.'+safe,r=await fetch(U+'/storage/v1/object/job-evidence/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file});if(!r.ok)throw new Error('Photo upload failed');paths.push(path)}return paths}function safeValue(){const x=document.querySelector('input[name=safe]:checked');return x?x.value==='true':null}async function submitSheet(){$('sheetMsg').innerHTML='';const note=$('eventNote').value.trim();if(sheetType==='evidence'){if(mode==='no_access'&&(!$('attemptedContact').checked||selected.length<1||note.length<3))return $('sheetMsg').innerHTML='<div class="error">No Access needs a photo, contact attempt and note.</div>';if(mode==='completion'&&(selected.length<1||note.length<3))return $('sheetMsg').innerHTML='<div class="error">Completion needs a photo and work summary.</div>'}let action=mode;if(sheetType==='continuation'&&mode==='repair_pending')action=$('reasonSelect').value;if(sheetType==='continuation'&&['repair_pending','part_required','more_work_required','revised_quote_required','specialist_required'].includes(action)&&safeValue()===null)return $('sheetMsg').innerHTML='<div class="error">Confirm whether the property is safe to leave.</div>';if(sheetType==='continuation'&&['repair_pending','part_required','more_work_required','revised_quote_required','specialist_required'].includes(action)&&note.length<3)return $('sheetMsg').innerHTML='<div class="error">Add a short diagnosis / next-step note.</div>';if(action==='part_required'&&$('partDetails').value.trim().length<2)return $('sheetMsg').innerHTML='<div class="error">Add the part or material required.</div>';if(action==='return_booked'&&!$('returnAt').value)return $('sheetMsg').innerHTML='<div class="error">Choose the return date and time.</div>';$('saveEvent').disabled=true;$('saveEvent').textContent='SAVING…';try{const paths=await uploadPhotos();if(sheetType==='evidence')await api('/rest/v1/rpc/create_my_job_site_event',{method:'POST',body:JSON.stringify({p_job_id:id,p_event_type:mode,p_note:note,p_attempted_contact:mode==='no_access'?$('attemptedContact').checked:false,p_photo_paths:paths})});else await api('/rest/v1/rpc/update_my_job_continuation',{method:'POST',body:JSON.stringify({p_job_id:id,p_action:action,p_note:note||null,p_part_details:$('partDetails').value.trim()||null,p_property_safe:safeValue(),p_return_visit_at:$('returnAt').value?new Date($('returnAt').value).toISOString():null,p_photo_paths:paths})});closeSheet();$('msg').innerHTML='<div class="notice">Job updated ✓</div>';await refresh()}catch(e){$('sheetMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{$('saveEvent').disabled=false;$('saveEvent').textContent='SAVE'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('/trade-sw.js').catch(()=>{});boot();</script></body></html>
