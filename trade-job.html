<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1724"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/trade-manifest.webmanifest"><link rel="icon" href="/trade-icon.svg"><title>VettTrade Job</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f3f5f7;--card:#fff;--line:#dfe5ea;--muted:#697581;--green:#16785a;--red:#b94747;--amber:#996f1c}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body{padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 13px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:900}.brand{font-weight:950}.brand span{color:var(--gold)}.wrap{max-width:760px;margin:auto;padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin:11px 0}.eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:950;color:#927026}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;background:#eef2f5}.badge.green{background:#e8f6ef;color:var(--green)}.badge.red{background:#faeaea;color:var(--red)}.badge.amber{background:#fff5de;color:var(--amber)}h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:4px 0 12px}.muted{color:var(--muted);line-height:1.5}.meta{font-size:12px;color:var(--muted);line-height:1.55}.customer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.primary,.secondary,.danger,.good{border-radius:12px;padding:13px 14px;font-weight:950;text-align:center;text-decoration:none;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.danger{border:0;background:#9f3434;color:#fff}.good{border:0;background:var(--green);color:#fff}.actionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bigAction{min-height:88px;border-radius:15px;border:1px solid var(--line);background:#fff;padding:12px 8px;font-weight:950;color:var(--ink);font-size:12px}.bigAction strong{display:block;font-size:25px;margin-bottom:5px}.bigAction.noaccess{background:#fff6e5;border-color:#ead7aa}.bigAction.complete{background:#edf8f3;border-color:#cae5d8}.event{border-left:4px solid #d6dde2;padding:12px 0 12px 14px;margin:6px 0}.event.no_access{border-color:#d6a64b}.event.completion{border-color:var(--green)}.event.arrived{border-color:#457aa3}.photos{display:flex;gap:8px;overflow:auto;margin-top:10px}.photos img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.sheet{position:fixed;inset:0;z-index:50;background:#07101ab8;display:flex;align-items:flex-end}.sheetCard{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0003}.sheetHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:#eef2f5;border-radius:999px;width:36px;height:36px;font-size:18px}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}textarea{width:100%;min-height:85px;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.photoPick{border:2px dashed #cbd4dc;border-radius:14px;padding:18px;text-align:center;background:#fafbfc}.photoPick input{display:none}.preview{display:flex;gap:8px;overflow:auto;margin-top:10px}.preview img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.check{display:flex;gap:9px;align-items:flex-start;margin:13px 0}.check input{width:20px;height:20px;margin-top:1px}.submit{width:100%;margin-top:14px}.notice,.error{padding:12px;border-radius:10px;margin:10px 0;font-size:13px}.notice{background:#edf8f3;color:#23634d}.error{background:#fff0f0;color:#8d3939}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.navItem{text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:850;padding:8px 4px;border-radius:10px}.navItem strong{display:block;font-size:19px}.hidden{display:none!important}@media(max-width:480px){.actionGrid{grid-template-columns:1fr 1fr}.bigAction.complete{grid-column:1/-1}.customer{grid-template-columns:1fr}.customer .secondary{width:100%}}@media(min-width:800px){.sheet{align-items:center;justify-content:center}.sheetCard{max-width:620px;border-radius:22px}.bottom{left:50%;transform:translateX(-50%);max-width:760px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}}</style></head><body><header class="top"><a href="/trade-app.html">← Jobs</a><div class="brand">VETT<span>TRADE</span></div><a href="/trade-hub.html">£ Pay</a></header><main class="wrap"><div id="msg"></div><section id="jobCard" class="card"><div class="muted">Loading job…</div></section><section id="actionsCard" class="card hidden"><div class="eyebrow">ON SITE</div><h2>Record what happened</h2><div class="actionGrid"><button class="bigAction" onclick="openSheet('arrived')"><strong>📍</strong>ARRIVED</button><button class="bigAction noaccess" onclick="openSheet('no_access')"><strong>🚪</strong>NO ACCESS</button><button id="completeAction" class="bigAction complete" onclick="openSheet('completion')"><strong>✅</strong>COMPLETE JOB</button></div><p class="muted" style="font-size:12px;margin-bottom:0">Photos are stored privately against this job. No Access and Completion require photo evidence.</p></section><section class="card"><div class="eyebrow">EVIDENCE TRAIL</div><h2>Site activity</h2><div id="events"><div class="muted">No site evidence yet.</div></div></section></main><nav class="bottom"><a class="navItem" href="/trade-app.html"><strong>🧰</strong>Jobs</a><a class="navItem" href="/trade-hub.html"><strong>£</strong>Quotes & Pay</a><a class="navItem" href="/trade-portal.html"><strong>👤</strong>Profile</a></nav><div id="sheet" class="sheet hidden"><div class="sheetCard"><div class="sheetHead"><div><div id="sheetEyebrow" class="eyebrow"></div><h2 id="sheetTitle" style="margin:5px 0"></h2></div><button class="close" onclick="closeSheet()">×</button></div><p id="sheetHelp" class="muted"></p><div class="photoPick"><input id="photoInput" type="file" accept="image/*" capture="environment" multiple><label for="photoInput" style="margin:0;cursor:pointer"><b>📷 TAKE / ADD PHOTOS</b><br><span class="muted" style="font-size:12px">Use the rear camera or choose existing photos.</span></label><div id="preview" class="preview"></div></div><label id="noteLabel" for="eventNote">NOTE</label><textarea id="eventNote"></textarea><div id="contactRow" class="check hidden"><input id="attemptedContact" type="checkbox"><label for="attemptedContact" style="margin:0">I attempted to contact the customer / occupier.</label></div><button id="saveEvent" class="primary submit" onclick="submitEvent()">SAVE</button><div id="sheetMsg"></div></div></div><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),job=null,siteEvents=[],mode=null,selected=[];const id=new URLSearchParams(location.search).get('id');async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||d?.msg||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString():'—'}function statusLabel(s){return({accepted:'Assigned',contacted:'Contacted',quoted:'Quoted',won:'Agreed',completed:'Completed',lost:'Closed'})[String(s||'').toLowerCase()]||s}async function boot(){if(!s?.access_token||!id){location.href='/trade-app.html';return}try{await refresh()}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function refresh(){const jobs=await api('/rest/v1/rpc/get_trade_jobs',{method:'POST',body:'{}'});job=jobs.find(x=>x.id===id);if(!job)throw new Error('This job is not available to your trade account.');renderJob();await loadEvents()}function renderJob(){const st=String(job.status).toLowerCase();jobCard.innerHTML='<div><span class="badge '+(st==='completed'?'green':st==='lost'?'red':'amber')+'">'+esc(statusLabel(st))+'</span><h1>'+esc(job.trade_category)+' · '+esc(job.job_type)+'</h1><div class="meta">'+esc(job.reference)+' · '+esc(job.area)+' · '+esc(job.urgency)+' · '+esc(job.property_type||'Property')+'</div><p>'+esc(job.description)+'</p></div>'+(job.customer_name?'<div class="customer"><div><div class="eyebrow">CUSTOMER</div><b>'+esc(job.customer_name)+'</b><div class="meta">'+esc(job.customer_phone||'')+(job.customer_email?'<br>'+esc(job.customer_email):'')+'</div></div>'+(job.customer_phone?'<a class="secondary" href="tel:'+encodeURIComponent(job.customer_phone)+'">📞 CALL CUSTOMER</a>':'')+'</div>':'');actionsCard.classList.toggle('hidden',['completed','lost'].includes(st));completeAction.disabled=st!=='won';completeAction.style.opacity=st==='won'?'1':'.45';completeAction.title=st==='won'?'':'Customer must accept the quote before completion can be recorded.'}async function loadEvents(){try{const r=await fetch(U+'/functions/v1/job-evidence-links',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({leadId:id})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load evidence');siteEvents=d.events||[];renderEvents()}catch(e){events.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function renderEvents(){events.innerHTML=siteEvents.length?siteEvents.map(e=>'<div class="event '+esc(e.event_type)+'"><b>'+esc(e.event_type==='no_access'?'NO ACCESS CARD':e.event_type==='completion'?'JOB COMPLETED':'ARRIVED ON SITE')+'</b><div class="meta">'+dt(e.created_at)+(e.trade_name?' · '+esc(e.trade_name):'')+'</div>'+(e.attempted_contact?'<div class="meta">✓ Contact attempt recorded</div>':'')+(e.note?'<p style="margin:7px 0">'+esc(e.note)+'</p>':'')+(e.photos?.length?'<div class="photos">'+e.photos.map(p=>p.url?'<a href="'+esc(p.url)+'" target="_blank"><img src="'+esc(p.url)+'" alt="Job evidence"></a>':'').join('')+'</div>':'')+'</div>').join(''):'<div class="muted">No site evidence yet.</div>'}function openSheet(m){if(m==='completion'&&String(job.status).toLowerCase()!=='won'){msg.innerHTML='<div class="error">The customer must accept the repair quote before you can complete the job.</div>';return}mode=m;selected=[];photoInput.value='';preview.innerHTML='';eventNote.value='';attemptedContact.checked=false;contactRow.classList.toggle('hidden',m!=='no_access');sheetEyebrow.textContent=m==='arrived'?'ATTENDANCE':m==='no_access'?'NO ACCESS CARD':'COMPLETION EVIDENCE';sheetTitle.textContent=m==='arrived'?'Record arrival':m==='no_access'?'Record no access':'Complete this job';sheetHelp.textContent=m==='arrived'?'Timestamp your arrival. Add a photo if useful.':m==='no_access'?'Take at least one photo showing the attendance point, confirm contact was attempted, and add a short note.':'Take at least one completion photo and add a short summary of the work completed.';noteLabel.textContent=m==='completion'?'WORK COMPLETED':m==='no_access'?'NO ACCESS NOTE':'ARRIVAL NOTE (OPTIONAL)';eventNote.placeholder=m==='completion'?'e.g. Replaced kitchen tap, tested and left working':m==='no_access'?'e.g. Knocked twice, called customer, no answer':'Optional note';saveEvent.textContent=m==='arrived'?'SAVE ARRIVAL':m==='no_access'?'CREATE NO ACCESS CARD':'SAVE COMPLETION';sheet.classList.remove('hidden');sheetMsg.innerHTML=''}function closeSheet(){sheet.classList.add('hidden')}photoInput.onchange=()=>{selected=[...photoInput.files].slice(0,6);preview.innerHTML=selected.map(f=>'<img src="'+URL.createObjectURL(f)+'" alt="Selected photo">').join('')};async function prepareFile(file){if(file.size<=7.5*1024*1024)return file;try{const img=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.82));if(blob)return new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'})}catch{}throw new Error('One photo is too large. Please retake it or choose a smaller image.')}async function uploadPhotos(){const paths=[];for(const original of selected){const file=await prepareFile(original),ext=(file.name.split('.').pop()||'jpg').toLowerCase(),safe=['jpg','jpeg','png','webp','heic','heif'].includes(ext)?ext:'jpg',path=s.user.id+'/'+id+'/'+mode+'/'+crypto.randomUUID()+'.'+safe;const r=await fetch(U+'/storage/v1/object/job-evidence/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file});if(!r.ok){const t=await r.text();throw new Error('Photo upload failed: '+t.slice(0,120))}paths.push(path)}return paths}async function submitEvent(){sheetMsg.innerHTML='';const note=eventNote.value.trim();if(mode==='no_access'&&(!attemptedContact.checked||selected.length<1||note.length<3)){sheetMsg.innerHTML='<div class="error">No Access needs a photo, attempted-contact confirmation and a short note.</div>';return}if(mode==='completion'&&(selected.length<1||note.length<3)){sheetMsg.innerHTML='<div class="error">Completion needs at least one photo and a short work summary.</div>';return}saveEvent.disabled=true;saveEvent.textContent='UPLOADING…';try{const paths=await uploadPhotos();await api('/rest/v1/rpc/create_my_job_site_event',{method:'POST',body:JSON.stringify({p_job_id:id,p_event_type:mode,p_note:note,p_attempted_contact:mode==='no_access'?attemptedContact.checked:false,p_photo_paths:paths})});closeSheet();msg.innerHTML='<div class="notice">'+(mode==='no_access'?'No Access Card saved.':mode==='completion'?'Completion evidence saved.':'Arrival recorded.')+'</div>';await refresh()}catch(e){sheetMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{saveEvent.disabled=false;saveEvent.textContent='SAVE'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('/trade-sw.js').catch(()=>{});boot();</script></body></html>
