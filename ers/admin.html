<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERS Admin | Estate Response Services</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0D1B2A;--navy2:#15283b;--sage:#6B8F71;--sage2:#58785e;--stone:#D9D2C3;--cream:#F7F4EE;--soft:#F2F4F5;--ink:#18222c;--muted:#6b7680;--line:#dfe4e6;--white:#fff;--red:#9d3f3f;--amber:#8b620d;--green:#28633a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--cream);color:var(--ink)}button,input,select,textarea{font:inherit}.hide{display:none!important}.top{height:72px;background:var(--navy);display:flex;align-items:center;padding:0 4%;color:#fff;gap:12px}.logo{font-family:Georgia,serif;font-size:28px;font-weight:800;color:#f4ecdd}.logo span{font-family:inherit;color:var(--sage)}.subbrand{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c7d0d6}.spacer{flex:1}.top button{border:1px solid #425363;background:transparent;color:#fff;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.wrap{max-width:1420px;margin:auto;padding:28px 4%}.auth{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 16px 50px rgba(13,27,42,.08)}h1,h2,h3{margin-top:0}h1{font-family:Georgia,serif;font-size:40px;color:var(--navy);margin-bottom:8px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--sage2)}.muted{color:var(--muted)}label{display:block;font-size:11px;font-weight:850;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #ccd4d9;border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink)}textarea{min-height:115px;resize:vertical}.primary,.secondary{border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{border:0;background:var(--sage);color:#fff}.primary:hover{background:var(--sage2)}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.head{display:flex;align-items:end;justify-content:space-between;gap:20px}.head p{margin:3px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.kpi small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted)}.kpi b{display:block;font-size:28px;margin-top:5px;color:var(--navy)}.toolbar{display:grid;grid-template-columns:1.2fr .7fr .7fr auto;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.panelHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}.panelHead h2{font-size:18px;margin:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #edf0f1;padding:12px;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f7f9f9}.name{font-weight:850;color:var(--navy)}.status{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap;background:#eef2f0;color:#46564e}.status.new{background:#fff2d9;color:var(--amber)}.status.contact{background:#e7eef7;color:#365d8b}.status.booked{background:#e6f3e9;color:var(--green)}.status.complete,.status.converted{background:#e1f2e5;color:#235d34}.status.closed{background:#eceff1;color:#68737a}.link{color:#355f84;font-weight:750}.rowbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.empty{padding:34px;text-align:center;color:var(--muted)}.notice,.error{padding:11px 13px;border-radius:9px;margin:12px 0;font-size:12px}.notice{background:#e9f3eb;color:#2c6038;border:1px solid #cce0d0}.error{background:#f9eaea;color:#873838;border:1px solid #e8caca}.drawerBack{position:fixed;inset:0;background:#07111bdd;z-index:40;display:flex;justify-content:flex-end}.drawer{width:min(650px,100%);height:100%;overflow:auto;background:var(--cream);padding:24px}.drawerCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}.drawerTop{display:flex;gap:12px;align-items:start}.drawerTop h2{font-family:Georgia,serif;color:var(--navy);font-size:28px;margin-bottom:4px}.close{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:11px;background:var(--soft);border-radius:10px}.fact small{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:var(--muted);margin-bottom:4px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #d8e2da;background:#f3f7f4;color:#426148;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:750}.drawerActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.drawerActions a{text-align:center;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.head{align-items:start;flex-direction:column}}@media(max-width:650px){.wrap{padding:20px 12px}.top{padding:0 14px}.subbrand{display:none}h1{font-size:32px}.kpis{grid-template-columns:1fr 1fr}.toolbar,.facts,.grid,.drawerActions{grid-template-columns:1fr}.full{grid-column:auto}.drawer{padding:14px}.kpi b{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="logo">E<span>R</span>S</div><div class="subbrand">Estate Response Services · Admin</div><div class="spacer"></div><button id="logout" class="hide">Sign out</button></header>
<main class="wrap">
<section id="auth" class="auth"><div class="eyebrow">Private operations</div><h1>ERS Admin</h1><p class="muted">Use your existing authorised admin email and password.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" style="width:100%;margin-top:15px">SIGN IN</button></form><div id="authMsg"></div></section>
<section id="app" class="hide"><div class="head"><div><div class="eyebrow">Case intake</div><h1>Assessment Inbox</h1><p class="muted">New enquiries, contact progress and assessment bookings in one place.</p></div><div class="actions"><a class="secondary" href="/ers/" style="text-decoration:none">View customer site</a><button class="secondary" onclick="loadRequests()">Refresh</button></div></div><div id="msg"></div><div class="kpis" id="kpis"></div><div class="toolbar"><input id="search" placeholder="Search name, postcode, email or property"><select id="statusFilter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Assessment Booked</option><option>Assessment Complete</option><option>Converted</option><option>Closed</option></select><select id="roleFilter"><option value="">All roles</option><option>Executor</option><option>Administrator / personal representative</option><option>Solicitor / professional referrer</option><option>Family member / beneficiary</option><option>Attorney / deputy</option><option>Other</option></select><button class="secondary" onclick="resetFilters()">Clear</button></div><div class="panel"><div class="panelHead"><h2>Assessment requests</h2><div class="spacer"></div><span class="muted" id="count"></span></div><div id="tableWrap"></div></div></section>
</main>
<div id="drawerBack" class="drawerBack hide"><aside class="drawer"><div id="drawerContent"></div></aside></div>
<script>
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';
const db=window.supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}});let session=JSON.parse(localStorage.getItem('vt_session')||'null'),rows=[],selected=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const date=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';const dateTime=v=>v?new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function flash(t,bad=false){$('msg').innerHTML='<div class="'+(bad?'error':'notice')+'">'+esc(t)+'</div>'}
function stat(v){const s=String(v||'New'),c=s==='New'?'new':s==='Contacted'?'contact':s==='Assessment Booked'?'booked':s==='Assessment Complete'?'complete':s==='Converted'?'converted':'closed';return '<span class="status '+c+'">'+esc(s)+'</span>'}
async function restore(){if(!session?.access_token)return false;try{await db.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});const {data:ok,error}=await db.rpc('is_vett_admin');if(error||!ok)throw Error('Admin access required');showApp();return true}catch(e){localStorage.removeItem('vt_session');session=null;return false}}
function showApp(){$('auth').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');loadRequests()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('authMsg').innerHTML='';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}session=data.session;localStorage.setItem('vt_session',JSON.stringify(session));const {data:ok,error:adminErr}=await db.rpc('is_vett_admin');if(adminErr||!ok){await db.auth.signOut();localStorage.removeItem('vt_session');$('authMsg').innerHTML='<div class="error">This account does not have admin access.</div>';return}showApp()});
$('logout').onclick=async()=>{await db.auth.signOut();localStorage.removeItem('vt_session');location.reload()};
async function loadRequests(){const {data,error}=await db.from('ers_assessment_requests').select('*').order('created_at',{ascending:false});if(error){flash(error.message,true);return}rows=data||[];render()}
function render(){const newCount=rows.filter(x=>(x.status||'New')==='New').length,contacted=rows.filter(x=>x.status==='Contacted').length,booked=rows.filter(x=>x.status==='Assessment Booked').length,complete=rows.filter(x=>x.status==='Assessment Complete').length,converted=rows.filter(x=>x.status==='Converted').length;$('kpis').innerHTML=[['New',newCount],['Contacted',contacted],['Booked',booked],['Completed',complete],['Converted',converted]].map(x=>'<div class="kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('');renderTable()}
function filtered(){const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value,role=$('roleFilter').value;return rows.filter(r=>{const hay=[r.full_name,r.email,r.phone,r.property_address,r.postcode,r.organisation].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||(r.status||'New')===st)&&(!role||r.capacity===role)})}
function renderTable(){const f=filtered();$('count').textContent=f.length+' shown';if(!f.length){$('tableWrap').innerHTML='<div class="empty">No assessment requests match these filters.</div>';return}$('tableWrap').innerHTML='<div class="scroll"><table><thead><tr><th>Received</th><th>Client</th><th>Role</th><th>Property</th><th>Help needed</th><th>Status</th><th>Next step</th></tr></thead><tbody>'+f.map(r=>'<tr><td>'+date(r.created_at)+'</td><td><span class="name">'+esc(r.full_name)+'</span><br><a class="link" href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a><br><a class="link" href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></td><td>'+esc(r.capacity||'—')+(r.organisation?'<br><span class="muted">'+esc(r.organisation)+'</span>':'')+'</td><td>'+esc(r.property_address||'—')+'<br><b>'+esc(r.postcode||'')+'</b></td><td>'+esc((r.service_interest||[]).slice(0,2).join(', ')||'Not specified')+((r.service_interest||[]).length>2?'…':'')+'</td><td>'+stat(r.status)+'</td><td><button class="rowbtn" onclick="openRequest(\''+r.id+'\')">OPEN</button></td></tr>').join('')+'</tbody></table></div>'}
['search','statusFilter','roleFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderTable));function resetFilters(){$('search').value='';$('statusFilter').value='';$('roleFilter').value='';renderTable()}
function openRequest(id){selected=rows.find(x=>x.id===id);if(!selected)return;const r=selected,services=(r.service_interest||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')||'<span class="muted">Not specified</span>';$('drawerContent').innerHTML='<div class="drawerTop"><div><div class="eyebrow">Assessment request</div><h2>'+esc(r.full_name)+'</h2><div>'+stat(r.status)+'</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawerCard"><div class="facts"><div class="fact"><small>Received</small>'+dateTime(r.created_at)+'</div><div class="fact"><small>Preferred contact</small>'+esc(r.preferred_contact||'—')+'</div><div class="fact"><small>Role</small>'+esc(r.capacity||'—')+'</div><div class="fact"><small>Organisation</small>'+esc(r.organisation||'—')+'</div><div class="fact"><small>Property status</small>'+esc(r.property_status||'—')+'</div><div class="fact"><small>Timeframe</small>'+esc(r.timeframe||'—')+'</div></div></div><div class="drawerCard"><h3>Contact</h3><div class="drawerActions"><a class="primary" href="tel:'+esc(r.phone)+'">Call '+esc(r.phone)+'</a><a class="secondary" href="mailto:'+esc(r.email)+'">Email client</a></div></div><div class="drawerCard"><h3>Property</h3><p>'+esc(r.property_address||'—')+'<br><b>'+esc(r.postcode||'')+'</b></p><label>Authority / probate position</label><p class="muted">'+esc(r.authority_status||'Not supplied')+'</p><label>Services mentioned</label><div class="chips">'+services+'</div></div><div class="drawerCard"><h3>Client notes</h3><p class="muted" style="white-space:pre-wrap">'+esc(r.notes||'No additional notes supplied.')+'</p></div><div class="drawerCard"><h3>Update case</h3><div class="grid"><div><label>Status</label><select id="editStatus">'+['New','Contacted','Assessment Booked','Assessment Complete','Converted','Closed'].map(x=>'<option '+((r.status||'New')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>Assessment date</label><input id="editDate" type="datetime-local" value="'+toLocalInput(r.assessment_date)+'"></div><div class="full"><label>Internal admin notes</label><textarea id="editNotes" placeholder="Call outcome, access details, next steps…">'+esc(r.admin_notes||'')+'</textarea></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveRequest()">SAVE UPDATE</button></div>';$('drawerBack').classList.remove('hide')}
function toLocalInput(v){if(!v)return '';const d=new Date(v),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function closeDrawer(){$('drawerBack').classList.add('hide');selected=null}$('drawerBack').addEventListener('click',e=>{if(e.target===$('drawerBack'))closeDrawer()});
async function saveRequest(){if(!selected)return;const status=$('editStatus').value,when=$('editDate').value?new Date($('editDate').value).toISOString():null,payload={status,assessment_date:when,admin_notes:$('editNotes').value.trim()||null,updated_at:new Date().toISOString()};if(status==='Contacted'&&!selected.contacted_at)payload.contacted_at=new Date().toISOString();const {error}=await db.from('ers_assessment_requests').update(payload).eq('id',selected.id);if(error){alert(error.message);return}closeDrawer();flash('Assessment request updated.');await loadRequests()}
restore();
</script>
</body></html>
