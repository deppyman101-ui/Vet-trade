<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VettTrade Admin · Property Partners</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 4%}.brand{font-weight:950}.brand span{color:var(--gold)}.top a{color:inherit;text-decoration:none;font-weight:850}.wrap{max-width:1100px;margin:auto;padding:34px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.auth{max-width:500px;margin:50px auto}.muted{color:var(--muted);line-height:1.5}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input{width:100%;padding:11px;border:1px solid #d6dde3;border-radius:8px;font:inherit}.primary,.secondary,.danger{padding:10px 13px;border-radius:8px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.danger{border:1px solid #eccaca;background:#fff0f0;color:#8d3939}.hidden{display:none!important}.notice,.error{padding:12px;border-radius:8px;margin:12px 0}.notice{background:#edf8f3}.error{background:#fff0f0}.partner{display:grid;grid-template-columns:1.2fr 1fr auto;gap:18px;align-items:center;border-top:1px solid #edf0f2;padding:16px 0}.partner:first-child{border-top:0}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2f5}.ok{background:#e8f6ef;color:var(--green)}.warn{background:#fff5de;color:#87671f}@media(max-width:760px){.partner{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">VETT<span>TRADE</span> · PROPERTY PARTNERS</div><div><a href="/admin-agreements.html">Signed Agreements</a> · <a href="/admin.html">Admin</a></div></header><main class="wrap"><section id="authBox" class="card auth"><div class="eyebrow">Owner access</div><h1>Admin login</h1><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary" style="width:100%;margin-top:16px">SIGN IN</button></form><div id="authMsg"></div></section><section id="app" class="hidden"><div class="card"><div class="eyebrow">Partner approvals</div><h1>Property Partner Accounts</h1><p class="muted">A partner cannot be activated until the current Property Partner Agreement has been electronically signed and the signed PDF is retained by VettTrade.</p><button class="secondary" onclick="load()">Refresh</button><div id="msg"></div></div><div class="card"><div id="list"></div></div></section></main><script>
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),partners=[];async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function boot(){if(!s?.access_token)return;try{if(!await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'}))throw new Error('Admin access required');authBox.classList.add('hidden');app.classList.remove('hidden');load()}catch(e){authMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function load(){try{partners=await api('/rest/v1/rpc/get_admin_property_partners',{method:'POST',body:'{}'});render()}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function render(){list.innerHTML=partners.length?partners.map(p=>'<div class="partner"><div><b>'+esc(p.organisation_name)+'</b><br><span class="muted">'+esc(p.contact_name)+(p.role_title?' · '+esc(p.role_title):'')+'<br>'+esc(p.email)+(p.phone?' · '+esc(p.phone):'')+'</span></div><div><span class="status">'+esc(p.organisation_type.replaceAll('_',' '))+'</span> '+(p.agreement_signed_at?'<span class="status ok">AGREEMENT SIGNED</span>':'<span class="status warn">SIGNATURE REQUIRED</span>')+' '+(p.active?'<span class="status ok">ACTIVE</span>':'<span class="status warn">NOT ACTIVE</span>')+(p.agreement_signed_at?'<br><span class="muted">'+esc(p.agreement_version)+' · '+new Date(p.agreement_signed_at).toLocaleString()+'</span>':'')+'</div><div>'+(p.active?'<button class="danger" onclick="setActive(\''+p.id+'\',false)">Suspend</button>':'<button class="primary" onclick="setActive(\''+p.id+'\',true)">Activate</button>')+'</div></div>').join(''):'<p class="muted">No Property Partner accounts yet.</p>'}async function setActive(id,a){try{await api('/rest/v1/rpc/admin_set_property_partner_active',{method:'POST',body:JSON.stringify({p_partner_id:id,p_active:a})});msg.innerHTML='<div class="notice">Partner '+(a?'activated':'suspended')+'.</div>';load()}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));boot()}catch(e){authMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}};boot();
</script></body></html>
