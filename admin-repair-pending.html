<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair Pending | VettTrade Admin</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882;--green:#16785a;--red:#ad4040;--blue:#2f6f9f}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-weight:950}.brand span{color:var(--gold)}.top a{color:var(--ink);text-decoration:none;font-weight:850}.wrap{max-width:1300px;margin:auto;padding:34px 20px 70px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.muted{color:var(--muted);line-height:1.5}.primary,.secondary{border-radius:9px;padding:11px 14px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--ink);color:#fff;border:0}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.panel,.login{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}.login{max-width:480px;margin:60px auto}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:6px 0 12px;font:inherit}.login button{width:100%}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:28px;margin-top:5px}.job{border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.jobTop{display:flex;justify-content:space-between;gap:15px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;background:#fff5de;color:#83631d;margin:0 5px 5px 0}.badge.blue{background:#eaf3fb;color:var(--blue)}.badge.red{background:#faeaea;color:var(--red)}.meta{font-size:12px;color:var(--muted);line-height:1.55}.detail{background:#f8fafb;border-radius:10px;padding:11px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.notice,.error{padding:12px;border-radius:8px;margin:12px 0}.notice{background:#edf8f3;color:#23634d}.error{background:#fff0f0;color:#8d3939}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.jobTop,.head{flex-direction:column;align-items:flex-start}}@media(max-width:520px){.kpis{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand">VETT<span>TRADE</span> · REPAIR PENDING</div><a href="/admin-master.html">← Admin home</a></div><main class="wrap"><section id="login" class="login hidden"><div class="eyebrow">Admin access</div><h1>Sign in</h1><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="primary">SIGN IN</button></form><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="head"><div><div class="eyebrow">Continuation control</div><h1 style="margin:5px 0">Repair Pending Board</h1><p class="muted">Jobs that need a part, revised scope, specialist or return visit stay visible here until resolved.</p></div><div class="actions"><a class="secondary" href="/admin.html">MAIN DASHBOARD</a><button class="primary" onclick="load()">REFRESH</button></div></div><div id="msg"></div><div class="kpis"><div class="kpi"><small>Pending repairs</small><strong id="pendingCount">0</strong></div><div class="kpi"><small>Parts required</small><strong id="partCount">0</strong></div><div class="kpi"><small>Return booked</small><strong id="returnCount">0</strong></div><div class="kpi"><small>Revised quote needed</small><strong id="revisionCount">0</strong></div></div><div class="panel"><div id="jobs"></div></div></section></main><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),data=[];async function api(path,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString():'—'}function stage(v){return({repair_pending:'Repair pending',part_required:'Part required',part_ordered:'Part ordered',more_work_required:'More work required',revised_quote_required:'Revised quote required',specialist_required:'Specialist required',return_booked:'Return booked',return_arrived:'Return arrived'})[String(v||'').toLowerCase()]||String(v||'').replaceAll('_',' ')}function relevant(j){return['repair_pending','part_required','part_ordered','more_work_required','revised_quote_required','specialist_required','return_booked','return_arrived'].includes(String(j.repair_stage||'').toLowerCase())&&!['completed','lost'].includes(String(j.status||'').toLowerCase())}async function boot(){if(!s?.access_token){login.classList.remove('hidden');return}try{if(!await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'}))throw new Error('Admin access required');login.classList.add('hidden');app.classList.remove('hidden');await load()}catch(e){login.classList.remove('hidden');app.classList.add('hidden');loginMsg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function load(){try{data=await api('/rest/v1/rpc/get_admin_jobs_v2',{method:'POST',body:'{}'});render()}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function render(){const arr=data.filter(relevant);pendingCount.textContent=arr.length;partCount.textContent=arr.filter(j=>['part_required','part_ordered'].includes(j.repair_stage)).length;returnCount.textContent=arr.filter(j=>['return_booked','return_arrived'].includes(j.repair_stage)).length;revisionCount.textContent=arr.filter(j=>['revised_quote_required','more_work_required'].includes(j.repair_stage)).length;jobs.innerHTML=arr.length?arr.map(j=>'<article class="job"><div class="jobTop"><div><span class="badge">'+esc(j.reference)+'</span><span class="badge blue">'+esc(stage(j.repair_stage))+'</span>'+(j.property_safe===false?'<span class="badge red">PROPERTY NOT SAFE</span>':'')+'<h3 style="margin:6px 0">'+esc(j.trade_category)+' · '+esc(j.job_type)+'</h3><div class="meta">'+esc(j.customer_name)+' · '+esc(j.customer_phone)+' · '+esc(j.area)+' · '+esc(j.urgency)+'</div></div><div class="meta">Assigned: '+esc(j.assigned_business_name||'Unassigned')+'</div></div><div class="detail">'+(j.continuation_note?'<b>Latest note</b><br>'+esc(j.continuation_note):'<span class="muted">No continuation note.</span>')+(j.part_details?'<br><br><b>Part / material</b><br>'+esc(j.part_details):'')+(j.return_visit_at?'<br><br><b>Return visit</b><br>'+esc(dt(j.return_visit_at)):'')+'</div><div class="actions"><a class="secondary" href="/admin.html">OPEN MAIN JOBS</a><a class="secondary" href="/admin-evidence.html">VIEW EVIDENCE</a><a class="primary" href="/admin.html#jobsTab">PAYMENT / ASSIGNMENT</a></div></article>').join(''):'<div class="empty"><b>No repair-pending jobs.</b><br>Jobs needing parts or return visits will appear here automatically.</div>'}form.onsubmit=async e=>{e.preventDefault();loginMsg.innerHTML='';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));await boot()}catch(x){loginMsg.innerHTML='<div class="error">'+esc(x.message)+'</div>'}};boot();</script></body></html>
