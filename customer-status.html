<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your repair · VettTrade</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--paper:#f7f8f9;--line:#e1e6ea;--muted:#6f7882;--green:#16785a}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--paper);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:950}.brand span{color:var(--gold)}.top a{color:inherit;text-decoration:none;font-weight:850}.wrap{max-width:760px;margin:auto;padding:48px 20px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.hero h1{font-size:42px;margin:9px 0 12px}.muted{color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #d6dde3;border-radius:8px;font:inherit}.primary{width:100%;margin-top:14px;border:0;background:var(--ink);color:#fff;font-weight:900;padding:13px;border-radius:8px}.error,.notice{padding:12px;border-radius:8px;margin-top:14px}.error{background:#fff0f0}.notice{background:#edf8f3}.summary{display:flex;justify-content:space-between;gap:18px}.badge{padding:7px 10px;border-radius:999px;background:#e8f6ef;color:var(--green);font-size:12px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin-top:5px}.timeline{margin-top:25px}.stage{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:22px}.stage:not(:last-child):before{content:"";position:absolute;left:17px;top:32px;bottom:0;width:2px;background:#e2e6e9}.dot{width:36px;height:36px;border-radius:50%;background:#eef2f5;display:grid;place-items:center;font-weight:900;z-index:1}.stage.done .dot{background:#e8f6ef;color:var(--green)}.stage.current .dot{background:var(--ink);color:#fff}.stage h3{margin:2px 0 4px}.stage p{margin:0;color:var(--muted);font-size:13px}.trade{margin-top:18px;padding:14px;border-radius:10px;background:#f7f8fa;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:620px){.grid{grid-template-columns:1fr}.summary{flex-direction:column}.hero h1{font-size:34px}}</style></head><body><div class="top"><div class="brand">VETT<span>TRADE</span></div><a href="/">← Home</a></div><main class="wrap"><div class="hero"><div class="eyebrow">Customer tracking</div><h1>Track your repair.</h1><p class="muted">Enter your VettTrade reference and the same phone number used when the repair was submitted.</p></div><section class="card" id="lookupCard"><form id="trackForm"><div class="grid"><div><label>JOB REFERENCE</label><input id="reference" required placeholder="VT-XXXXXXXX"></div><div><label>PHONE NUMBER</label><input id="phone" required placeholder="07..."></div></div><button id="trackButton" class="primary">TRACK MY REPAIR</button></form><div id="message"></div></section><section class="card hidden" id="resultCard"><div class="summary"><div><div class="eyebrow">Live job status</div><h2 id="jobTitle" style="margin:7px 0 3px"></h2><div id="jobMeta" class="meta"></div></div><span id="statusBadge" class="badge"></span></div><div id="tradeBox" class="trade hidden"></div><div id="timeline" class="timeline"></div><button class="primary" onclick="resetLookup()" style="background:#fff;color:var(--ink);border:1px solid var(--line)">TRACK ANOTHER REPAIR</button></section></main><script>
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2',order=['received','assigned','contacted','quoted','won','completed'],labels={received:['Request received','VettTrade has received your repair request.'],assigned:['Trade assigned','An approved trade has been assigned to your repair.'],contacted:['Contact made','The assigned trade has marked the customer as contacted.'],quoted:['Quote sent','A quote has been sent for the proposed work.'],won:['Job agreed','The job has been marked as agreed / won.'],completed:['Completed','The repair has been marked complete.']};function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function idx(d){const s=String(d.status||'').toLowerCase();if(s==='completed')return 5;if(s==='won')return 4;if(s==='quoted')return 3;if(s==='contacted')return 2;if(['accepted','offered'].includes(s)||d.plumber_business_name)return 1;return 0}function render(d){const i=idx(d),st=String(d.status||'').toLowerCase();jobTitle.textContent=d.job_type||'Property repair';jobMeta.textContent=[d.reference,d.area,d.urgency].filter(Boolean).join(' · ');statusBadge.textContent=st==='lost'?'Needs follow-up':labels[order[i]][0];if(d.plumber_business_name){tradeBox.classList.remove('hidden');tradeBox.innerHTML='<b>Assigned trade:</b> '+esc(d.plumber_business_name)}else tradeBox.classList.add('hidden');let html=st==='lost'?'<div class="notice"><b>VettTrade follow-up required.</b> This job is no longer progressing with the assigned trade.</div>':'';html+=order.map((k,n)=>'<div class="stage '+(n<=i?'done ':'')+(n===i?'current':'')+'"><div class="dot">'+(n<=i?'✓':n+1)+'</div><div><h3>'+labels[k][0]+'</h3><p>'+labels[k][1]+'</p></div></div>').join('');timeline.innerHTML=html;lookupCard.classList.add('hidden');resultCard.classList.remove('hidden')}async function lookup(r,p){const x=await fetch(U+'/rest/v1/rpc/get_customer_job_status',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_reference:r,p_phone:p})}),d=await x.json();if(!x.ok)throw new Error('Unable to check this job right now.');if(!Array.isArray(d)||!d.length)throw new Error('We could not match that reference and phone number.');return d[0]}trackForm.onsubmit=async e=>{e.preventDefault();trackButton.disabled=true;trackButton.textContent='CHECKING...';message.innerHTML='';try{render(await lookup(reference.value.trim().toUpperCase(),phone.value.trim()))}catch(x){message.innerHTML='<div class="error">'+esc(x.message)+'</div>'}finally{trackButton.disabled=false;trackButton.textContent='TRACK MY REPAIR'}};function resetLookup(){resultCard.classList.add('hidden');lookupCard.classList.remove('hidden');message.innerHTML='';phone.value=''}const q=new URLSearchParams(location.search);if(q.get('ref'))reference.value=q.get('ref').toUpperCase();</script></body></html>
