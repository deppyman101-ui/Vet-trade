<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track your job · Vett Trade</title>
<style>
:root{--ink:#0b1724;--gold:#d4aa4c;--paper:#f7f8f9;--card:#fff;--line:#e1e6ea;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.top a{text-decoration:none;font-weight:800;font-size:13px}.wrap{max-width:760px;margin:0 auto;padding:48px 20px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.hero h1{font-size:42px;line-height:1.05;margin:9px 0 12px}.muted{color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:900;margin:0 0 6px}input{width:100%;padding:12px;border:1px solid #d6dde3;border-radius:8px;font:inherit}.primary{width:100%;margin-top:14px;border:0;background:var(--ink);color:#fff;font-weight:900;padding:13px 15px;border-radius:8px;cursor:pointer}.primary:disabled{opacity:.6;cursor:not-allowed}.notice,.error{padding:12px;border-radius:8px;margin-top:14px}.notice{background:#edf8f3;border:1px solid #cde8dc;color:#23634d}.error{background:#fff0f0;border:1px solid #eccaca;color:#8d3939}.summary{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#e8f6ef;color:var(--green);font-size:12px;font-weight:900;text-transform:capitalize}.meta{font-size:13px;color:var(--muted);margin-top:5px}.timeline{margin-top:25px}.stage{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:22px}.stage:not(:last-child):before{content:"";position:absolute;left:17px;top:32px;bottom:0;width:2px;background:#e2e6e9}.dot{width:36px;height:36px;border-radius:50%;background:#eef2f5;display:grid;place-items:center;font-weight:900;color:#8a949d;z-index:1}.stage.done .dot{background:#e8f6ef;color:var(--green)}.stage.current .dot{background:var(--ink);color:#fff}.stage h3{margin:2px 0 4px;font-size:16px}.stage p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.trade{margin-top:18px;padding:14px;border-radius:10px;background:#f7f8fa;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:620px){.grid{grid-template-columns:1fr}.summary{flex-direction:column}.hero h1{font-size:34px}}
</style>
</head>
<body>
<div class="top"><div class="brand">VETT <span>TRADE</span></div><a href="/">← Back to Vett Trade</a></div>
<main class="wrap">
  <div class="hero"><div class="eyebrow">Customer tracking</div><h1>Track your plumbing request.</h1><p class="muted">Enter the reference you received when you submitted the job and the same phone number you used on the request.</p></div>
  <section class="card" id="lookupCard">
    <form id="trackForm">
      <div class="grid"><div><label>JOB REFERENCE</label><input id="reference" required placeholder="VT-XXXXXXXX" autocomplete="off"></div><div><label>PHONE NUMBER</label><input id="phone" required placeholder="07..." inputmode="tel" autocomplete="tel"></div></div>
      <button id="trackButton" class="primary">TRACK MY REQUEST</button>
    </form>
    <div id="message"></div>
  </section>
  <section class="card hidden" id="resultCard">
    <div class="summary"><div><div class="eyebrow">Live job status</div><h2 id="jobTitle" style="margin:7px 0 3px"></h2><div id="jobMeta" class="meta"></div></div><span id="statusBadge" class="badge"></span></div>
    <div id="tradeBox" class="trade hidden"></div>
    <div id="timeline" class="timeline"></div>
    <button class="primary" type="button" onclick="resetLookup()" style="background:#fff;color:var(--ink);border:1px solid var(--line)">TRACK ANOTHER REQUEST</button>
  </section>
</main>
<script>
const U='https://iymhyxheggqsewpczgjl.supabase.co';
const K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';
const order=['received','assigned','contacted','quoted','won','completed'];
const labels={received:['Request received','We have your plumbing request.'],assigned:['Trade assigned','A suitable Vett Trade professional has been assigned.'],contacted:['Contact made','The trade has marked your request as contacted.'],quoted:['Quote sent','The trade has marked a quote as sent.'],won:['Job agreed','The trade has marked the job as won/agreed.'],completed:['Completed','The trade has marked the job as completed.']};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stageIndex(d){const s=String(d.status||'').toLowerCase();if(s==='completed')return 5;if(s==='won')return 4;if(s==='quoted')return 3;if(s==='contacted')return 2;if(['accepted','offered'].includes(s)||d.plumber_business_name)return 1;return 0}
function friendlyStatus(d){const s=String(d.status||'').toLowerCase();if(s==='lost')return 'Needs follow-up';return labels[order[stageIndex(d)]][0]}
function render(d){const i=stageIndex(d);document.getElementById('jobTitle').textContent=d.job_type||'Plumbing request';document.getElementById('jobMeta').textContent=[d.reference,d.area,d.urgency].filter(Boolean).join(' · ');document.getElementById('statusBadge').textContent=friendlyStatus(d);const tb=document.getElementById('tradeBox');if(d.plumber_business_name){tb.classList.remove('hidden');tb.innerHTML='<b>Assigned trade:</b> '+esc(d.plumber_business_name)}else tb.classList.add('hidden');const s=String(d.status||'').toLowerCase();let html='';if(s==='lost'){html='<div class="notice"><b>Vett Trade follow-up required.</b> This request is no longer progressing with the assigned trade.</div>'}html+=order.map((key,n)=>{const done=n<=i,cur=n===i;return '<div class="stage '+(done?'done ':'')+(cur?'current':'')+'"><div class="dot">'+(done?'✓':n+1)+'</div><div><h3>'+labels[key][0]+'</h3><p>'+labels[key][1]+'</p></div></div>'}).join('');document.getElementById('timeline').innerHTML=html;document.getElementById('lookupCard').classList.add('hidden');document.getElementById('resultCard').classList.remove('hidden')}
async function lookup(ref,phone){const r=await fetch(U+'/rest/v1/rpc/get_customer_job_status',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_reference:ref,p_phone:phone})});const txt=await r.text();let d;try{d=txt?JSON.parse(txt):null}catch{d=null}if(!r.ok)throw new Error('Unable to check this request right now.');if(!Array.isArray(d)||!d.length)throw new Error('We could not match that reference and phone number. Check both and try again.');return d[0]}
document.getElementById('trackForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('trackButton'),m=document.getElementById('message'),ref=document.getElementById('reference').value.trim().toUpperCase(),phone=document.getElementById('phone').value.trim();b.disabled=true;b.textContent='CHECKING...';m.innerHTML='';try{render(await lookup(ref,phone))}catch(x){m.innerHTML='<div class="error">'+esc(x.message)+'</div>'}finally{b.disabled=false;b.textContent='TRACK MY REQUEST'}};
function resetLookup(){document.getElementById('resultCard').classList.add('hidden');document.getElementById('lookupCard').classList.remove('hidden');document.getElementById('message').innerHTML='';document.getElementById('phone').value='';document.getElementById('phone').focus()}
const qs=new URLSearchParams(location.search);if(qs.get('ref'))document.getElementById('reference').value=qs.get('ref').toUpperCase();
</script>
</body></html>
