olumns:1fr 1fr;gap:12px;margin-top:14px}.formCard{padding:17px}.formCard h3{margin:0 0 5px}.small{font-size:11px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.kpis,.grid,.quick{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.wrap{padding:20px 12px}}</style></head><body><header class="top"><div class="brand">WASTE<span>PILOT</span> · ADMIN</div><div class="spacer"></div><button id="logout" class="hide">Sign out</button></header><main class="wrap"><section id="auth" class="auth"><div class="eyebrow">Private operations</div><h1>Admin login</h1><p class="muted">Use your authorised WastePilot admin email and password.</p><form id="loginForm"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%;margin-top:15px">SIGN IN</button></form><div id="authMsg"></div></section><section id="app" class="hide"><div class="head"><div><div class="eyebrow">Managed waste operations</div><h1>WastePilot Control Room</h1><p class="muted">Businesses, carrier partners, collections, pricing and compliance in one place.</p></div><div class="actions"><button class="primary" onclick="openBusiness()">+ BUSINESS</button><button class="primary" onclick="openCarrier()">+ CARRIER</button><button class="primary" onclick="openCollection()">+ COLLECTION</button><button class="secondary" onclick="loadAll()">Refresh</button></div></div><div id="msg"></div><div class="tabs"><button class="tab on" data-tab="home">Overview</button><button class="tab" data-tab="businesses">Businesses</button><button class="tab" data-tab="carriers">Carriers</button><button class="tab" data-tab="collections">Collections</button></div><div id="view"></div></section></main><div id="modal" class="modal hide"><div class="modalCard"><div id="modalBody"></div></div></div><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null'),tab='home',clients=[],carriers=[],collections=[],overview={};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=x=>x===null||x===undefined||x===''?'—':'£'+Number(x).toFixed(2),dt=x=>x?new Date(x).toLocaleDateString('en-GB'):'—';async function api(path,o={}){const h={apikey:K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error||d?.hint||'Request failed');return d}function flash(t,bad=false){$('msg').innerHTML='<div class="'+(bad?'error':'notice')+'">'+esc(t)+'</div>'}function stat(x){const v=String(x||'');let c=['Active','Collected','Booked','Ready'].includes(v)?'good':['Missed','Issue','Lost','Cancelled'].includes(v)?'bad':'warn';return'<span class="status '+c+'">'+esc(v)+'</span>'}function clientName(id){return clients.find(x=>x.id===id)?.business_name||'Unknown business'}function carrierName(id){return id?(carriers.find(x=>x.id===id)?.business_name||'Unknown carrier'):'Unassigned'}async function boot(){if(!s?.access_token)return;try{const ok=await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'});if(!ok)throw Error('Admin access required');$('auth').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');await loadAll()}catch(e){$('authMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function loadAll(){try{[overview,clients,carriers,collections]=await Promise.all([api('/rest/v1/rpc/get_wastepilot_admin_overview',{method:'POST',body:'{}'}),api('/rest/v1/wastepilot_clients?select=*&order=created_at.desc'),api('/rest/v1/wastepilot_carriers?select=*&order=created_at.desc'),api('/rest/v1/wastepilot_collections?select=*&order=created_at.desc')]);render()}catch(e){flash(e.message,true)}}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='businesses')return renderBusinesses();if(tab==='carriers')return renderCarriers();if(tab==='collections')return renderCollections();renderHome()}function renderHome(){const margin=collections.reduce((n,x)=>n+(Number(x.client_price_gbp||0)-Number(x.carrier_cost_gbp||0)),0);$('view').innerHTML='<div class="kpis">'+[['Businesses',overview?.clients||0],['Active',overview?.active_clients||0],['Live leads',overview?.leads||0],['Active carriers',overview?.active_carriers||0],['Planned collections',overview?.planned_collections||0],['Issues',overview?.issues||0]].map(x=>'<div class="kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="quick"><div class="formCard"><h3>Managed monthly value</h3><div style="font-size:32px;font-weight:950">'+money(overview?.monthly_client_value_gbp||0)+'</div><p class="muted small">Current monthly spend recorded for active WastePilot businesses.</p></div><div class="formCard"><h3>Recorded collection margin</h3><div style="font-size:32px;font-weight:950">'+money(margin)+'</div><p class="muted small">Client price minus carrier cost across collections currently entered.</p></div></div><div class="panel"><div class="panelHead"><h2>Latest businesses</h2></div>'+(clients.length?'<div class="scroll"><table><tr><th>Business</th><th>Waste</th><th>Compliance</th><th>Status</th><th>Current spend</th></tr>'+clients.slice(0,7).map(c=>'<tr><td><b>'+esc(c.business_name)+'</b><br><span class="muted">'+esc(c.postcode||'')+'</span></td><td>'+esc((c.waste_streams||[]).join(', ')||'Not set')+'</td><td>'+stat(c.compliance_status)+'</td><td>'+stat(c.status)+'</td><td class="money">'+money(c.current_monthly_cost_gbp)+'</td></tr>').join('')+'</table></div>': l})})}catch{}}async function setClientStatus(id){try{const status=$('cs-'+id).value;await patch('wastepilot_clients',id,{status});await log('client',id,'status_changed',{status});await loadAll();flash('Business status updated.')}catch(e){flash(e.message,true)}}async function toggleCarrier(id,a){try{await patch('wastepilot_carriers',id,{active:a});await log('carrier',id,a?'activated':'paused');await loadAll();flash(a?'Carrier activated.':'Carrier paused.')}catch(e){flash(e.message,true)}}async function setCollectionStatus(id){try{const status=$('co-'+id).value;await patch('wastepilot_collections',id,{status});await log('collection',id,'status_changed',{status});await loadAll();flash('Collection updated.')}catch(e){flash(e.message,true)}}function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}window.openBusiness=()=>modal('<div class="eyebrow">New business</div><h2>Add WastePilot business</h2><form id="businessForm"><div class="grid"><div><label>BUSINESS NAME</label><input id="bName" required></div><div><label>CONTACT NAME</label><input id="bContact"></div><div><label>EMAIL</label><input id="bEmail" type="email"></div><div><label>PHONE</label><input id="bPhone"></div><div><label>POSTCODE</label><input id="bPostcode"></div><div><label>BUSINESS TYPE</label><input id="bType" placeholder="Restaurant, office, retail..."></div><div><label>FTE EMPLOYEES</label><input id="bFte" type="number" min="0"></div><div><label>NUMBER OF SITES</label><input id="bSites" type="number" min="1" value="1"></div><div class="full"><label>WASTE STREAMS</label><div class="checks">'+['General waste','Food waste','Dry recycling','Cardboard','Glass','Specialist / other'].map(x=>'<label><input type="checkbox" name="bs" value="'+x+'">'+x+'</label>').join('')+'</div></div><div><label>COLLECTION FREQUENCY</label><input id="bFreq" placeholder="e.g. Twice a week"></div><div><label>CURRENT VOLUME</label><input id="bVolum
