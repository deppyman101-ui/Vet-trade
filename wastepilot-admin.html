<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WastePilot Control Room</title>
<style>
:root{--deep:#06191f;--ink:#092027;--green:#31d88b;--green2:#18ae6c;--paper:#f4f8f6;--line:#d8e6e0;--muted:#687c75;--red:#9e3d3d;--amber:#8a5a08}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}button,input,select,textarea{font:inherit}.hide{display:none!important}.top{min-height:68px;background:var(--deep);color:#fff;display:flex;align-items:center;padding:10px 4%;gap:12px}.brand{font-size:22px;font-weight:1000;letter-spacing:-.04em}.brand span{color:var(--green)}.spacer{flex:1}.top a,.top button{border:1px solid #36555d;background:transparent;color:#fff;border-radius:9px;padding:9px 12px;font-weight:850;cursor:pointer;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:26px 4%}.auth{max-width:470px;margin:55px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:950;color:#108258}.muted{color:var(--muted);line-height:1.5}.small{font-size:11px}.head{display:flex;align-items:flex-end;gap:20px;justify-content:space-between}.head h1{font-size:38px;letter-spacing:-.04em;margin:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{padding:10px 13px;border-radius:9px;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--green),var(--green2));color:#042118}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;border:1px solid #ebcccc;color:var(--red)}.primary:disabled{opacity:.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;font-weight:850;cursor:pointer}.tab.on{background:var(--deep);color:#fff}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.kpi{padding:16px}.kpi small{display:block;color:var(--muted);font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-size:26px;margin-top:6px}.panel{margin-top:14px;overflow:hidden}.panelHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.panelHead h2{margin:0;font-size:18px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1060px}th,td{padding:11px 12px;border-bottom:1px solid #edf3f0;text-align:left;font-size:12px;vertical-align:top}th{background:#f7faf8;color:var(--muted);font-size:9px;letter-spacing:.04em;text-transform:uppercase}.status{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf3f0;font-size:9px;font-weight:950;white-space:nowrap}.good{background:#e2f7ec;color:#0b714e}.warn{background:#fff2d8;color:#895a0b}.bad{background:#fbe8e8;color:#973939}.money{font-weight:950}.notice,.error{padding:11px 12px;border-radius:8px;margin:10px 0}.notice{background:#edf8f3;border:1px solid #cde8dc;color:#23634d}.error{background:#fff0f0;border:1px solid #eccaca;color:#8d3939}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:17px}.card h3{margin:0 0 6px}.demand{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.demandItem{padding:13px;border-radius:10px;background:#f7faf8;border:1px solid #e2ece7}.demandItem b{font-size:23px;display:block}.pitchBox{background:var(--deep);color:#fff;border-radius:14px;padding:18px}.pitchBox p{color:#b8c9c4;line-height:1.55;margin:8px 0 14px}.modal{position:fixed;inset:0;background:#031013dd;z-index:50;display:grid;place-items:center;padding:15px}.modalCard{width:min(800px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:22px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:950;letter-spacing:.04em;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cdded7;border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}.checks{display:flex;gap:7px;flex-wrap:wrap}.checks label{border:1px solid var(--line);border-radius:999px;padding:7px 10px;margin:0;font-weight:750}.checks input{width:auto;margin:0 5px 0 0}.modalActions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}.demand{grid-template-columns:repeat(2,1fr)}}@media(max-width:740px){.kpis,.grid2,.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.wrap{padding:20px 12px}.demand{grid-template-columns:1fr 1fr}.top{padding:10px 12px}.head h1{font-size:31px}}
</style>
</head>
<body>
<header class="top"><div class="brand">WASTE<span>PILOT</span> · CONTROL ROOM</div><div class="spacer"></div><a href="/wastepilot/" target="_blank">Public page</a><button id="logout" class="hide">Sign out</button></header>
<main class="wrap">
<section id="auth" class="auth"><div class="eyebrow">Private operations</div><h1>Admin login</h1><p class="muted">Use an authorised shared admin account.</p><form id="loginForm"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="username" required><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%;margin-top:15px">SIGN IN</button></form><div id="authMsg"></div></section>
<section id="app" class="hide"><div class="head"><div><div class="eyebrow">Commercial waste buying group</div><h1>WastePilot Control Room</h1><p class="muted">Monitor real buying-group demand, take the numbers to carriers, present better rates and track recurring commission.</p></div><div class="actions"><button class="primary" onclick="openBusiness()">+ BUSINESS</button><button class="primary" onclick="openOffer()">+ CARRIER OFFER</button><button class="secondary" onclick="loadAll()">Refresh</button></div></div><div id="msg"></div><div class="tabs"><button class="tab on" data-tab="overview">Overview</button><button class="tab" data-tab="businesses">Businesses</button><button class="tab" data-tab="offers">Carrier offers</button><button class="tab" data-tab="carriers">Carriers</button></div><div id="view"></div></section>
</main>
<div id="modal" class="modal hide"><div class="modalCard"><div id="modalBody"></div></div></div>
<script>
const U='https://iymhyxheggqsewpczgjl.supabase.co';
const K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';
const FN=U+'/functions/v1/wastepilot-signup';
let s=JSON.parse(localStorage.getItem('vt_session')||'null'),tab='overview',clients=[],carriers=[],offers=[];
const $=x=>document.getElementById(x);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=x=>x===null||x===undefined||x===''?'—':'£'+Number(x).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-GB'):'—';
async function api(path,o={}){const h={apikey:K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error||d?.hint||'Request failed');return d}
function flash(t,bad=false){$('msg').innerHTML='<div class="'+(bad?'error':'notice')+'">'+esc(t)+'</div>';setTimeout(()=>{if($('msg'))$('msg').innerHTML=''},5000)}
function stat(x){const v=String(x||'—');const good=['Live','Approved','Accepted','Ready for review','Offer ready','Active','Presented'].includes(v),bad=['Lost','Declined','Not proceeding','Inactive'].includes(v);return '<span class="status '+(good?'good':bad?'bad':'warn')+'">'+esc(v)+'</span>'}
function clientName(id){return clients.find(x=>x.id===id)?.business_name||'Unknown business'}
function carrierName(id){return id?(carriers.find(x=>x.id===id)?.business_name||'Unknown carrier'):'Unassigned'}
async function boot(){if(!s?.access_token)return;try{const ok=await api('/rest/v1/rpc/is_vett_admin',{method:'POST',body:'{}'});if(!ok)throw Error('Admin access required');$('auth').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');await loadAll()}catch(e){$('authMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadAll(){try{const a=await Promise.all([api('/rest/v1/wastepilot_clients?select=*&order=created_at.desc'),api('/rest/v1/wastepilot_carriers?select=*&order=created_at.desc'),api('/rest/v1/wastepilot_offers?select=*&order=created_at.desc').catch(()=>[])]);clients=a[0]||[];carriers=a[1]||[];offers=a[2]||[];render()}catch(e){flash(e.message,true)}}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='businesses')return renderBusinesses();if(tab==='offers')return renderOffers();if(tab==='carriers')return renderCarriers();renderOverview()}
function metrics(){const active=clients.filter(c=>c.status!=='Lost'&&c.group_status!=='Not proceeding'),spend=active.reduce((n,c)=>n+Number(c.current_monthly_cost_gbp||0),0),ready=active.filter(c=>c.group_status==='Ready for review'||c.group_status==='Pricing').length,offerReady=active.filter(c=>c.group_status==='Offer ready').length,live=active.filter(c=>c.switch_status==='Live'||c.group_status==='Live'),liveCommission=live.reduce((n,c)=>n+Number(c.commission_monthly_gbp||0),0),pipeline=active.filter(c=>!live.includes(c)).reduce((n,c)=>n+Number(c.commission_monthly_gbp||0),0);return{active,spend,ready,offerReady,live,liveCommission,pipeline}}
function streamData(){const map={};clients.filter(c=>c.status!=='Lost'&&c.group_status!=='Not proceeding').forEach(c=>(c.waste_streams||[]).forEach(w=>map[w]=(map[w]||0)+1));return Object.entries(map).sort((a,b)=>b[1]-a[1])}
function pitchText(){const m=metrics(),streams=streamData();let t=`WastePilot currently represents ${m.active.length} businesses with ${money(m.spend)} per month of recorded commercial waste spend (${money(m.spend*12)} annualised).`;if(streams.length)t+=' Demand by waste stream: '+streams.map(([k,v])=>`${k}: ${v} business${v===1?'':'es'}`).join('; ')+'.';return t}
async function copyPitch(){try{await navigator.clipboard.writeText(pitchText());flash('Carrier pitch numbers copied.')}catch(e){flash('Copy failed — select the text manually.',true)}}
function renderOverview(){const m=metrics(),streams=streamData(),latest=clients.slice(0,7);$('view').innerHTML=`<div class="kpis">${[['Businesses represented',m.active.length],['Monthly spend',money(m.spend)],['Ready to price',m.ready],['Offers ready',m.offerReady],['Live accounts',m.live.length],['Live commission',money(m.liveCommission)]].map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Demand by waste type</h3><p class="muted small">Real businesses currently recorded in the buying group.</p><div class="demand">${streams.length?streams.slice(0,8).map(([k,v])=>`<div class="demandItem"><b>${v}</b><span>${esc(k)}</span></div>`).join(''):'<div class="muted">No waste profiles recorded yet.</div>'}</div></div><div class="pitchBox"><div class="eyebrow">Carrier pitch snapshot</div><h3 style="margin:8px 0 0">Present real volume, not vague leads.</h3><p>${esc(pitchText())}</p><button class="primary" onclick="copyPitch()">COPY CURRENT NUMBERS</button><div class="small" style="color:#89a29b;margin-top:10px">Pipeline commission recorded: ${money(m.pipeline)}/month · Live annual run rate: ${money(m.liveCommission*12)}</div></div></div><div class="panel"><div class="panelHead"><h2>Latest buying-group signups</h2><div class="spacer"></div><button class="secondary" onclick="tab='businesses';render()">View all</button></div>${latest.length?`<div class="scroll"><table><tr><th>Business</th><th>Waste</th><th>Current carrier</th><th>Current spend</th><th>Group stage</th><th>Bill</th></tr>${latest.map(c=>`<tr><td><b>${esc(c.business_name)}</b><br><span class="muted">${esc(c.business_type||'')} · ${esc(c.postcode||'')}</span></td><td>${esc((c.waste_streams||[]).join(', ')||'Not provided')}</td><td>${esc(c.current_provider||'Not provided')}</td><td class="money">${money(c.current_monthly_cost_gbp)}</td><td>${stat(c.group_status)}</td><td>${c.bill_storage_path?`<button class="secondary" onclick="viewBill('${c.id}')">VIEW</button>`:'—'}</td></tr>`).join('')}</table></div>`:'<div class="empty">No businesses have joined yet.</div>'}</div>`}
function renderBusinesses(){$('view').innerHTML=`<div class="panel"><div class="panelHead"><h2>Businesses in the buying group</h2><div class="spacer"></div><button class="primary" onclick="openBusiness()">+ ADD BUSINESS</button></div>${clients.length?`<div class="scroll"><table><tr><th>Business</th><th>Contact</th><th>Waste setup</th><th>Current</th><th>Our offer</th><th>Saving</th><th>Stage</th><th>Commission</th><th>Actions</th></tr>${clients.map(c=>`<tr><td><b>${esc(c.business_name)}</b><br><span class="muted">${esc(c.business_type||'')}<br>${esc(c.postcode||'')}</span></td><td>${esc(c.contact_name||'')}<br>${esc(c.email||'')}<br>${esc(c.phone||'')}</td><td>${esc((c.waste_streams||[]).join(', ')||'—')}<br><span class="muted">${esc(c.collection_frequency||'')}<br>${esc(c.bin_setup||'')}</span></td><td><b>${money(c.current_monthly_cost_gbp)}</b><br><span class="muted">${esc(c.current_provider||'No carrier recorded')}<br>Contract end: ${dt(c.contract_end_date)}</span></td><td><b>${money(c.offer_monthly_gbp)}</b><br><span class="muted">${esc(carrierName(c.selected_carrier_id))}</span></td><td class="money">${money(c.monthly_saving_gbp)}<br><span class="muted">${c.annual_saving_gbp?money(c.annual_saving_gbp)+'/yr':'—'}</span></td><td>${stat(c.group_status)}<br><span style="display:inline-block;margin-top:4px">${stat(c.switch_status)}</span></td><td class="money">${money(c.commission_monthly_gbp)}<br><span class="muted">${c.commission_rate_percent?esc(c.commission_rate_percent)+'%':'—'}</span></td><td><div class="actions">${c.bill_storage_path?`<button class="secondary" onclick="viewBill('${c.id}')">Bill</button>`:''}<button class="secondary" onclick="openOffer('${c.id}')">Quote</button><button class="secondary" onclick="manageClient('${c.id}')">Manage</button></div></td></tr>`).join('')}</table></div>`:'<div class="empty">No businesses yet.</div>'}</div>`}
function renderOffers(){$('view').innerHTML=`<div class="panel"><div class="panelHead"><h2>Carrier offers</h2><div class="spacer"></div><button class="primary" onclick="openOffer()">+ ADD OFFER</button></div>${offers.length?`<div class="scroll"><table><tr><th>Business</th><th>Carrier</th><th>Monthly rate</th><th>Saving vs current</th><th>WastePilot commission</th><th>Contract</th><th>Status</th><th>Action</th></tr>${offers.map(o=>{const c=clients.find(x=>x.id===o.client_id),saving=c?.current_monthly_cost_gbp!=null?Math.max(Number(c.current_monthly_cost_gbp)-Number(o.monthly_rate_gbp),0):null,comm=o.commission_type==='fixed'?Number(o.commission_fixed_monthly_gbp||0):Number(o.monthly_rate_gbp||0)*Number(o.commission_rate_percent||0)/100;return`<tr><td><b>${esc(clientName(o.client_id))}</b></td><td>${esc(carrierName(o.carrier_id))}</td><td class="money">${money(o.monthly_rate_gbp)}</td><td class="money">${saving===null?'—':money(saving)}</td><td class="money">${money(comm)}/mo<br><span class="muted">${o.commission_type==='fixed'?'Fixed':esc(o.commission_rate_percent||0)+'%'}</span></td><td>${o.contract_months?esc(o.contract_months)+' months':'—'}</td><td>${stat(o.status)}</td><td><button class="primary" onclick="useOffer('${o.id}')">USE OFFER</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">No carrier offers recorded yet.</div>'}</div>`}
function renderCarriers(){$('view').innerHTML=`<div class="panel"><div class="panelHead"><h2>Carrier partners</h2><div class="spacer"></div><button class="primary" onclick="openCarrier()">+ ADD CARRIER</button></div>${carriers.length?`<div class="scroll"><table><tr><th>Carrier</th><th>Contact</th><th>Waste streams</th><th>Coverage</th><th>Registration</th><th>Pricing notes</th><th>Status</th><th>Action</th></tr>${carriers.map(c=>`<tr><td><b>${esc(c.business_name)}</b></td><td>${esc(c.contact_name||'')}<br>${esc(c.email||'')}<br>${esc(c.phone||'')}</td><td>${esc((c.waste_streams||[]).join(', ')||'—')}</td><td>${esc((c.coverage_areas||[]).join(', ')||'—')}</td><td>${esc(c.waste_carrier_registration||'Not recorded')}<br>${c.registration_verified?'<span class="status good">VERIFIED</span>':'<span class="status warn">CHECK</span>'}</td><td>${esc(c.pricing_notes||'—')}</td><td>${c.active?'<span class="status good">ACTIVE</span>':'<span class="status bad">INACTIVE</span>'}</td><td><button class="secondary" onclick="toggleCarrier('${c.id}',${!c.active})">${c.active?'PAUSE':'ACTIVATE'}</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No carrier partners yet.</div>'}</div>`}
async function add(table,data){const r=await api('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)});return r?.[0]}
async function patch(table,id,data){return api('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({...data,updated_at:new Date().toISOString()})})}
function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hide')}
function closeModal(){$('modal').classList.add('hide')}
window.openBusiness=()=>modal(`<div class="eyebrow">Buying group</div><h2>Add business manually</h2><form id="businessForm"><div class="formGrid"><div><label>BUSINESS NAME</label><input id="bName" required></div><div><label>BUSINESS TYPE</label><input id="bType" placeholder="Restaurant, office, salon..."></div><div><label>CONTACT NAME</label><input id="bContact" required></div><div><label>POSTCODE</label><input id="bPostcode" required></div><div><label>EMAIL</label><input id="bEmail" type="email"></div><div><label>PHONE</label><input id="bPhone"></div><div class="full"><label>WASTE STREAMS</label><div class="checks">${['General waste','Mixed recycling','Cardboard','Food waste','Glass','Clinical / hygiene','Confidential waste','Other'].map(x=>`<label><input type="checkbox" name="bs" value="${x}">${x}</label>`).join('')}</div></div><div><label>CURRENT CARRIER</label><input id="bProvider"></div><div><label>CURRENT MONTHLY COST £</label><input id="bCost" type="number" min="0" step="0.01"></div><div><label>COLLECTION FREQUENCY</label><input id="bFreq"></div><div><label>CONTRACT END</label><input id="bEnd" type="date"></div><div class="full"><label>BIN / CONTAINER SETUP</label><textarea id="bBins"></textarea></div><div class="full"><label>NOTES</label><textarea id="bNotes"></textarea></div></div><div class="modalActions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">SAVE BUSINESS</button></div></form>`);setTimeout(()=>{$('businessForm').onsubmit=saveBusiness},0)
async function saveBusiness(e){e.preventDefault();try{const row=await add('wastepilot_clients',{business_name:$('bName').value.trim(),business_type:$('bType').value.trim()||null,contact_name:$('bContact').value.trim(),postcode:$('bPostcode').value.trim().toUpperCase(),email:$('bEmail').value.trim()||null,phone:$('bPhone').value.trim()||null,waste_streams:[...document.querySelectorAll('input[name=bs]:checked')].map(x=>x.value),current_provider:$('bProvider').value.trim()||null,current_monthly_cost_gbp:$('bCost').value===''?null:Number($('bCost').value),collection_frequency:$('bFreq').value.trim()||null,contract_end_date:$('bEnd').value||null,bin_setup:$('bBins').value.trim()||null,notes:$('bNotes').value.trim()||null,status:'Joined',group_status:'Ready for review',switch_status:'Not started',consent_to_contact:true,signup_source:'admin'});closeModal();await loadAll();tab='businesses';render();flash('Business added to the buying group.')}catch(e){alert(e.message)}}
window.openCarrier=()=>modal(`<div class="eyebrow">Carrier network</div><h2>Add carrier partner</h2><form id="carrierForm"><div class="formGrid"><div><label>BUSINESS NAME</label><input id="cName" required></div><div><label>CONTACT NAME</label><input id="cContact"></div><div><label>EMAIL</label><input id="cEmail" type="email"></div><div><label>PHONE</label><input id="cPhone"></div><div><label>WASTE CARRIER REGISTRATION</label><input id="cReg"></div><div><label>REGISTRATION VERIFIED?</label><select id="cVerified"><option value="false">No</option><option value="true">Yes</option></select></div><div class="full"><label>WASTE STREAMS (comma separated)</label><input id="cStreams" placeholder="General waste, Food waste, Cardboard"></div><div class="full"><label>COVERAGE AREAS (comma separated)</label><input id="cCoverage" placeholder="Lewisham, Greenwich, Southwark"></div><div class="full"><label>PRICING / GROUP RATE NOTES</label><textarea id="cPricing"></textarea></div></div><div class="modalActions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">SAVE CARRIER</button></div></form>`);setTimeout(()=>{$('carrierForm').onsubmit=saveCarrier},0)
async function saveCarrier(e){e.preventDefault();try{await add('wastepilot_carriers',{business_name:$('cName').value.trim(),contact_name:$('cContact').value.trim()||null,email:$('cEmail').value.trim()||null,phone:$('cPhone').value.trim()||null,waste_carrier_registration:$('cReg').value.trim()||null,registration_verified:$('cVerified').value==='true',waste_streams:$('cStreams').value.split(',').map(x=>x.trim()).filter(Boolean),coverage_areas:$('cCoverage').value.split(',').map(x=>x.trim()).filter(Boolean),pricing_notes:$('cPricing').value.trim()||null,active:true});closeModal();await loadAll();tab='carriers';render();flash('Carrier added.')}catch(e){alert(e.message)}}
window.openOffer=(clientId='')=>{if(!clients.length)return flash('Add a business first.',true);if(!carriers.length)return flash('Add a carrier first.',true);modal(`<div class="eyebrow">Group pricing</div><h2>Record carrier offer</h2><form id="offerForm"><div class="formGrid"><div><label>BUSINESS</label><select id="oClient">${clients.map(c=>`<option value="${c.id}" ${c.id===clientId?'selected':''}>${esc(c.business_name)}</option>`).join('')}</select></div><div><label>CARRIER</label><select id="oCarrier">${carriers.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.business_name)}</option>`).join('')}</select></div><div><label>GROUP RATE £ / MONTH</label><input id="oRate" type="number" min="0" step="0.01" required></div><div><label>SETUP FEE £</label><input id="oSetup" type="number" min="0" step="0.01"></div><div><label>CONTRACT MONTHS</label><input id="oMonths" type="number" min="0" step="1"></div><div><label>COMMISSION TYPE</label><select id="oType"><option value="percentage">Percentage of monthly account</option><option value="fixed">Fixed monthly amount</option></select></div><div><label>RECURRING COMMISSION %</label><input id="oPct" type="number" min="0" max="100" step="0.01" value="15"></div><div><label>FIXED COMMISSION £ / MONTH</label><input id="oFixed" type="number" min="0" step="0.01"></div><div class="full"><label>NOTES</label><textarea id="oNotes" placeholder="What is included, bin size, lift frequency, exclusions, review date..."></textarea></div></div><div class="modalActions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">SAVE OFFER</button></div></form>`);setTimeout(()=>{$('offerForm').onsubmit=saveOffer},0)}
async function saveOffer(e){e.preventDefault();try{await add('wastepilot_offers',{client_id:$('oClient').value,carrier_id:$('oCarrier').value,monthly_rate_gbp:Number($('oRate').value),setup_fee_gbp:$('oSetup').value===''?null:Number($('oSetup').value),contract_months:$('oMonths').value===''?null:Number($('oMonths').value),commission_type:$('oType').value,commission_rate_percent:$('oPct').value===''?null:Number($('oPct').value),commission_fixed_monthly_gbp:$('oFixed').value===''?null:Number($('oFixed').value),status:'Quoted',notes:$('oNotes').value.trim()||null});closeModal();await loadAll();tab='offers';render();flash('Carrier offer saved.')}catch(e){alert(e.message)}}
async function useOffer(id){try{const o=offers.find(x=>x.id===id),c=clients.find(x=>x.id===o.client_id);if(!o||!c)return;const current=Number(c.current_monthly_cost_gbp||0),rate=Number(o.monthly_rate_gbp||0),saving=current?Math.max(current-rate,0):null,commission=o.commission_type==='fixed'?Number(o.commission_fixed_monthly_gbp||0):rate*Number(o.commission_rate_percent||0)/100;await patch('wastepilot_clients',c.id,{offer_monthly_gbp:rate,monthly_saving_gbp:saving,annual_saving_gbp:saving===null?null:saving*12,selected_carrier_id:o.carrier_id,commission_type:o.commission_type,commission_rate_percent:o.commission_rate_percent,commission_fixed_monthly_gbp:o.commission_fixed_monthly_gbp,commission_monthly_gbp:commission,group_status:'Offer ready',switch_status:'Offer ready'});await patch('wastepilot_offers',o.id,{status:'Presented'});await loadAll();tab='businesses';render();flash('Offer applied to the business. Saving and commission are now tracked.')}catch(e){flash(e.message,true)}}
function manageClient(id){const c=clients.find(x=>x.id===id);if(!c)return;modal(`<div class="eyebrow">Buying-group account</div><h2>${esc(c.business_name)}</h2><form id="manageForm"><div class="formGrid"><div><label>GROUP STAGE</label><select id="mGroup">${['Joined','Awaiting bill','Ready for review','Pricing','Offer ready','Switching','Live','Not proceeding'].map(x=>`<option ${c.group_status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>SWITCH STATUS</label><select id="mSwitch">${['Not started','Offer ready','Customer considering','Approved','Switching','Live','Declined'].map(x=>`<option ${c.switch_status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>CURRENT MONTHLY COST £</label><input id="mCost" type="number" min="0" step="0.01" value="${c.current_monthly_cost_gbp??''}"></div><div><label>CURRENT CARRIER</label><input id="mProvider" value="${esc(c.current_provider||'')}"></div><div><label>CONTRACT END</label><input id="mEnd" type="date" value="${c.contract_end_date||''}"></div><div><label>LIVE FROM</label><input id="mLive" type="date" value="${c.live_from||''}"></div><div><label>SELECTED CARRIER</label><select id="mCarrier"><option value="">Unassigned</option>${carriers.map(x=>`<option value="${x.id}" ${c.selected_carrier_id===x.id?'selected':''}>${esc(x.business_name)}</option>`).join('')}</select></div><div><label>MONTHLY COMMISSION £</label><input id="mCommission" type="number" min="0" step="0.01" value="${c.commission_monthly_gbp??''}"></div><div class="full"><label>NOTES</label><textarea id="mNotes">${esc(c.notes||'')}</textarea></div></div><div class="modalActions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">SAVE</button></div></form>`);setTimeout(()=>{$('manageForm').onsubmit=e=>saveManage(e,id)},0)}
async function saveManage(e,id){e.preventDefault();try{await patch('wastepilot_clients',id,{group_status:$('mGroup').value,switch_status:$('mSwitch').value,status:$('mGroup').value==='Not proceeding'?'Lost':'Joined',current_monthly_cost_gbp:$('mCost').value===''?null:Number($('mCost').value),current_provider:$('mProvider').value.trim()||null,contract_end_date:$('mEnd').value||null,live_from:$('mLive').value||null,selected_carrier_id:$('mCarrier').value||null,commission_monthly_gbp:$('mCommission').value===''?null:Number($('mCommission').value),notes:$('mNotes').value.trim()||null});closeModal();await loadAll();render();flash('Business updated.')}catch(e){alert(e.message)}}
async function toggleCarrier(id,active){try{await patch('wastepilot_carriers',id,{active});await loadAll();render();flash(active?'Carrier activated.':'Carrier paused.')}catch(e){flash(e.message,true)}}
async function viewBill(id){const w=window.open('','_blank');try{const r=await fetch(FN+'?action=bill-url&client_id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not open bill');if(w)w.location=d.url;else window.open(d.url,'_blank')}catch(e){if(w)w.close();flash(e.message,true)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));await boot()}catch(x){$('authMsg').innerHTML='<div class="error">'+esc(x.message)+'</div>'}};
$('logout').onclick=()=>{localStorage.removeItem('vt_session');location.reload()};
window.closeModal=closeModal;window.copyPitch=copyPitch;window.manageClient=manageClient;window.useOffer=useOffer;window.toggleCarrier=toggleCarrier;window.viewBill=viewBill;
boot();
</script>
</body></html>
