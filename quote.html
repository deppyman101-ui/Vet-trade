<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VettTrade Quote</title>
<style>
:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e2e7eb;--muted:#6f7882;--green:#16785a;--red:#ad4040}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.top a{color:var(--ink);text-decoration:none;font-weight:800;font-size:13px}.wrap{max-width:760px;margin:38px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin:14px 0;box-shadow:0 18px 50px #00000008}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#98732b}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}.total{font-size:30px;font-weight:900}.status{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#fff5de;color:#87671f}.ok{background:#e8f6ef;color:var(--green)}.bad{background:#faeaea;color:var(--red)}.primary{display:inline-block;border:0;background:var(--ink);color:#fff;font-weight:900;padding:13px 17px;border-radius:9px;cursor:pointer;text-decoration:none;width:100%;text-align:center}.primary:disabled{opacity:.55;cursor:not-allowed}.notice,.error{padding:12px;border-radius:8px;margin:12px 0}.notice{background:#edf8f3;border:1px solid #cde8dc;color:#23634d}.error{background:#fff0f0;border:1px solid #eccaca;color:#8d3939}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column;gap:4px}}
</style></head><body>
<div class="top"><div class="brand">VETT <span>TRADE</span></div><a href="/">Main site</a></div>
<div class="wrap"><div class="card"><div class="eyebrow">Secure customer quote</div><h1>VettTrade Quote</h1><div id="main"><p class="muted">Loading your quote…</p></div></div><div class="card"><b>VettPay</b><p class="muted" style="margin-bottom:0">Your quote total is the amount you pay. Any VettTrade completion fee is charged to the trade, not added on top of your quote.</p></div></div>
<script>
const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';
const token=new URLSearchParams(location.search).get('token');
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(p){return '£'+((Number(p)||0)/100).toFixed(2)}
async function rpc(fn,body){const r=await fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}
async function load(){if(!token){main.innerHTML='<div class="error">Quote link is incomplete.</div>';return}try{const a=await rpc('get_public_vett_quote_v2',{p_token:token}),q=a?.[0];if(!q){main.innerHTML='<div class="error">Quote not found.</div>';return}const st=String(q.status||'sent');let badge=st==='paid'?'<span class="status ok">PAID ✓</span>':st==='disputed'||st.includes('refund')?'<span class="status bad">'+esc(st.toUpperCase())+'</span>':'<span class="status">'+esc(st.toUpperCase())+'</span>';
let action='';if(st==='sent')action='<button id="accept" class="primary" onclick="acceptQuote()">ACCEPT QUOTE</button>';else if(st==='accepted')action='<div class="notice"><b>Quote accepted ✓</b><br>The trade will complete the agreed work, then VettPay will be used for payment.</div>';else if(st==='payment_pending'&&q.stripe_checkout_url)action='<a class="primary" href="'+esc(q.stripe_checkout_url)+'">PAY SECURELY WITH VETTPAY</a>';else if(st==='paid')action='<div class="notice"><b>Payment complete ✓</b><br>Thank you. Your VettPay payment has been recorded.</div>';else if(st==='refunded'||st==='partially_refunded')action='<div class="notice">Payment status: '+esc(st.replaceAll('_',' '))+'.</div>';else if(st==='disputed')action='<div class="error">This payment is currently under dispute review.</div>';
main.innerHTML='<div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start"><div><h2 style="margin-bottom:4px">'+esc(q.business_name)+'</h2><div class="muted">Job '+esc(q.reference)+'</div></div>'+badge+'</div><p style="font-size:17px;line-height:1.55">'+esc(q.description)+'</p><div class="row"><span>Labour</span><b>'+money(q.labour_pence)+'</b></div><div class="row"><span>Materials</span><b>'+money(q.materials_pence)+'</b></div><div class="row"><span>Other</span><b>'+money(q.other_pence)+'</b></div><div class="row" style="padding-top:18px"><span><b>Total</b></span><span class="total">'+money(q.total_pence)+'</span></div><div style="margin-top:20px">'+action+'</div>'; }catch(e){main.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function acceptQuote(){const b=document.getElementById('accept');b.disabled=true;b.textContent='ACCEPTING…';try{await rpc('accept_public_vett_quote',{p_token:token});await load()}catch(e){b.disabled=false;b.textContent='ACCEPT QUOTE';alert(e.message)}}
load();
</script></body></html>
