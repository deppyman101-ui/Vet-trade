<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vett Trade Verification</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#0b1724}.top{height:70px;background:#fff;border-bottom:1px solid #e2e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900}.brand span{color:#d4aa4c}.top a{color:#0b1724;text-decoration:none;font-weight:800}.wrap{max-width:820px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e7eb;border-radius:18px;padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6dde3;border-radius:8px;box-sizing:border-box}textarea{min-height:80px}.primary{margin-top:18px;border:0;background:#0b1724;color:#fff;font-weight:900;padding:13px 17px;border-radius:8px;cursor:pointer}.muted{color:#6f7882}.notice,.error{margin-top:14px;padding:12px;border-radius:8px}.notice{background:#edf8f3;color:#23634d;border:1px solid #cde8dc}.error{background:#fff0f0;color:#8d3939;border:1px solid #eccaca}.hidden{display:none}.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px}.check input{width:auto;margin-top:3px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand">VETT <span>TRADE</span> · VERIFY</div><a href="/">← Portal</a></div><div class="wrap"><div id="login" class="card"><h1>Trade verification</h1><p class="muted">Sign in to complete your Vett Trade verification.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary">SIGN IN</button></form><div id="loginMsg"></div></div><div id="formCard" class="card hidden"><h1>Verification application</h1><p class="muted">Upload genuine documents. Approval is manual.</p><form id="vf"><div class="grid"><div><label>LEGAL NAME</label><input id="legal" required></div><div><label>TRADING TYPE</label><select id="type" required><option value="sole_trader">Sole trader</option><option value="limited_company">Limited company</option><option value="partnership">Partnership</option></select></div></div><label>COMPANY NUMBER (IF LTD)</label><input id="company"><label>BUSINESS ADDRESS</label><textarea id="address" required></textarea><div class="grid"><div><label>YEARS TRADING</label><input id="years" type="number" min="0" required></div><div><label>WEBSITE / PROFILE</label><input id="website" placeholder="Website, Checkatrade, social profile"></div></div><div class="check"><input id="gas" type="checkbox"><label for="gas" style="margin:0">I want gas / boiler leads</label></div><label>GAS SAFE NUMBER</label><input id="gasnum" placeholder="Required for gas/boiler leads"><h3>Public liability insurance</h3><div class="grid"><div><label>INSURER</label><input id="insurer" required></div><div><label>POLICY NUMBER</label><input id="policy" required></div><div><label>COVER AMOUNT (£)</label><input id="cover" type="number" min="1" required></div><div><label>EXPIRY DATE</label><input id="expiry" type="date" required></div></div><label>PHOTO ID (PDF/JPG/PNG, max 10MB)</label><input id="idfile" type="file" accept="application/pdf,image/jpeg,image/png" required><label>PUBLIC LIABILITY CERTIFICATE (PDF/JPG/PNG, max 10MB)</label><input id="insfile" type="file" accept="application/pdf,image/jpeg,image/png" required><div class="check"><input id="consent" type="checkbox" required><label for="consent" style="margin:0">I confirm the information and documents are genuine and consent to Vett Trade verifying them.</label></div><button class="primary">SUBMIT FOR REVIEW</button></form><div id="msg"></div></div></div><script>const U='https://iymhyxheggqsewpczgjl.supabase.co',K='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let s=JSON.parse(localStorage.getItem('vt_session')||'null');async function api(p,o={}){const h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+p,{...o,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}async function load(){if(!s?.access_token)return;try{const a=await api('/rest/v1/rpc/get_my_verification_profile',{method:'POST',body:'{}'}),x=a?.[0];if(!x)throw new Error('Trade profile not found');login.classList.add('hidden');formCard.classList.remove('hidden');legal.value=x.legal_name||'';type.value=x.trading_type||'sole_trader';company.value=x.company_number||'';address.value=x.business_address||'';years.value=x.years_trading??'';website.value=x.website_url||'';gas.checked=!!x.wants_gas_work;gasnum.value=x.gas_safe_number||'';insurer.value=x.insurance_provider||'';policy.value=x.insurance_policy_number||'';cover.value=x.insurance_cover_pence?x.insurance_cover_pence/100:'';expiry.value=x.insurance_expiry||'';if(x.verification_status)msg.innerHTML='<div class="notice">Current verification status: <b>'+x.verification_status+'</b></div>'}catch(e){loginMsg.innerHTML='<div class="error">'+e.message+'</div>'}}async function upload(file,kind){if(file.size>10485760)throw new Error('File too large');const ext=(file.name.split('.').pop()||'bin').toLowerCase(),path=s.user.id+'/'+kind+'-'+Date.now()+'.'+ext;const r=await fetch(U+'/storage/v1/object/trade-verification/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':file.type,'x-upsert':'true'},body:file});if(!r.ok)throw new Error('Document upload failed');return path}loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(s));load()}catch(x){loginMsg.innerHTML='<div class="error">'+x.message+'</div>'}};vf.onsubmit=async e=>{e.preventDefault();try{if(gas.checked&&!gasnum.value.trim())throw new Error('Gas Safe number is required for gas/boiler leads');msg.innerHTML='<div class="notice">Uploading documents…</div>';const idp=await upload(idfile.files[0],'identity'),lip=await upload(insfile.files[0],'liability');await api('/rest/v1/rpc/update_my_verification_profile',{method:'POST',body:JSON.stringify({p_legal_name:legal.value.trim(),p_trading_type:type.value,p_company_number:company.value.trim(),p_business_address:address.value.trim(),p_years_trading:+years.value,p_website_url:website.value.trim(),p_wants_gas_work:gas.checked,p_gas_safe_number:gasnum.value.trim(),p_insurance_provider:insurer.value.trim(),p_insurance_policy_number:policy.value.trim(),p_insurance_cover_pence:Math.round(+cover.value*100),p_insurance_expiry:expiry.value,p_identity_document_path:idp,p_liability_document_path:lip,p_verification_consent:consent.checked})});msg.innerHTML='<div class="notice"><b>Submitted.</b> Your account is pending manual verification.</div>'}catch(x){msg.innerHTML='<div class="error">'+x.message+'</div>'}};load();</script></body></html>
