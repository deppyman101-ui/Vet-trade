<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vett Trade Settings</title><style>:root{--ink:#0b1724;--gold:#d4aa4c;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6f7882;--green:#16815d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.top a{color:var(--ink);font-weight:800;text-decoration:none;font-size:13px}.wrap{max-width:820px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 50px #0001}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#9b762b}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:900;margin:14px 0 7px}input{width:100%;padding:12px;border:1px solid #d8dde1;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc}.choice input{width:auto;margin-right:7px}.primary{border:0;background:var(--ink);color:#fff;padding:13px 18px;border-radius:8px;font-weight:900;cursor:pointer;margin-top:20px}.notice,.error{margin-top:14px;padding:12px;border-radius:8px}.notice{background:#edf8f3;color:#23634d;border:1px solid #cde8dc}.error{background:#fff0f0;color:#8d3939;border:1px solid #eccaca}.hidden{display:none!important}@media(max-width:650px){.grid,.choices{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand">VETT <span>TRADE</span> · SETTINGS</div><a href="/">← Back to portal</a></div><div class="wrap"><div id="loginCard" class="card"><div class="eyebrow">Trade account</div><h1>Sign in</h1><p class="muted">Use your Vett Trade login to manage matching preferences.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary">SIGN IN</button></form><div id="loginMsg"></div></div><div id="settingsCard" class="card hidden"><div class="eyebrow">Matching profile</div><h1>Where and what do you want?</h1><p class="muted">These settings power Vett Trade's plumber matching.</p><form id="settingsForm"><div class="grid"><div><label>BUSINESS NAME</label><input id="business" required></div><div><label>CONTACT NAME</label><input id="contact" required></div></div><label>PHONE</label><input id="phone" required><label>COVERAGE AREAS</label><div class="choices" id="areas"><label class="choice"><input type="checkbox" value="Bromley">Bromley</label><label class="choice"><input type="checkbox" value="Orpington">Orpington</label><label class="choice"><input type="checkbox" value="Beckenham">Beckenham</label><label class="choice"><input type="checkbox" value="Bexley">Bexley</label><label class="choice"><input type="checkbox" value="Dartford">Dartford</label><label class="choice"><input type="checkbox" value="Maidstone">Maidstone</label><label class="choice"><input type="checkbox" value="Sevenoaks">Sevenoaks</label><label class="choice"><input type="checkbox" value="Lewisham">Lewisham</label></div><label>OTHER AREAS / POSTCODE DISTRICTS</label><input id="otherAreas" placeholder="e.g. BR1, BR2, DA1, Chislehurst"><label>JOB TYPES</label><div class="choices" id="jobs"><label class="choice"><input type="checkbox" value="Leak or burst pipe">Leaks & burst pipes</label><label class="choice"><input type="checkbox" value="Blocked sink or toilet">Blocked sinks/toilets</label><label class="choice"><input type="checkbox" value="Tap or toilet repair">Tap/toilet repairs</label><label class="choice"><input type="checkbox" value="Heating or radiator">Heating/radiators</label><label class="choice"><input type="checkbox" value="Boiler or hot water">Boiler/hot water</label><label class="choice"><input type="checkbox" value="Bathroom plumbing">Bathroom plumbing</label><label class="choice"><input type="checkbox" value="Other plumbing problem">Other plumbing</label></div><button class="primary">SAVE MATCHING PROFILE</button></form><div id="msg"></div></div></div><script>const SUPA_URL='https://iymhyxheggqsewpczgjl.supabase.co',SUPA_KEY='sb_publishable_Q8yb_Mw70jDkwld8YGQRRw_h-T5Rau2';let session=JSON.parse(localStorage.getItem('vt_session')||'null');async function api(path,opts={}){const h={'apikey':SUPA_KEY,'Content-Type':'application/json',...(opts.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(SUPA_URL+path,{...opts,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error||'Request failed');return d}function vals(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value)}function setChecks(id,values){document.querySelectorAll('#'+id+' input').forEach(x=>x.checked=(values||[]).map(v=>v.toLowerCase()).includes(x.value.toLowerCase()))}async function load(){if(!session?.access_token)return;try{const p=await api('/rest/v1/rpc/get_my_trade_profile',{method:'POST',body:'{}'});const x=p?.[0];if(!x)throw new Error('Trade profile not found');document.getElementById('loginCard').classList.add('hidden');document.getElementById('settingsCard').classList.remove('hidden');business.value=x.business_name||'';contact.value=x.contact_name||'';phone.value=x.phone||'';setChecks('areas',x.coverage_areas);setChecks('jobs',x.job_types);const known=[...document.querySelectorAll('#areas input')].map(i=>i.value.toLowerCase());otherAreas.value=(x.coverage_areas||[]).filter(a=>!known.includes(String(a).toLowerCase())).join(', ')}catch(e){loginMsg.innerHTML='<div class="error">'+e.message+'</div>'}}loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};localStorage.setItem('vt_session',JSON.stringify(session));await load()}catch(x){loginMsg.innerHTML='<div class="error">'+x.message+'</div>'}};settingsForm.onsubmit=async e=>{e.preventDefault();const extra=otherAreas.value.split(',').map(x=>x.trim()).filter(Boolean),areas=[...new Set([...vals('areas'),...extra])],jobs=vals('jobs');try{await api('/rest/v1/rpc/update_my_trade_profile_settings',{method:'POST',body:JSON.stringify({p_business_name:business.value.trim(),p_contact_name:contact.value.trim(),p_phone:phone.value.trim(),p_coverage_areas:areas,p_job_types:jobs})});msg.innerHTML='<div class="notice"><b>Saved.</b> Smart matching will now use these areas and job types.</div>'}catch(x){msg.innerHTML='<div class="error">'+x.message+'</div>'}};load();</script></body></html>
